
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login | Food Platform</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .auth-box {
            max-width: 450px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .auth-box h1 { margin-bottom: 8px; }

        .auth-box p {
            color: #777;
            margin-bottom: 25px;
        }

        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            box-sizing: border-box;
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        .form-group input:focus { border-color: #ff6b35; }

        .login-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #ff6b35;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:disabled {
            opacity: .6;
            cursor: wait;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            display: none;
            overflow-wrap: anywhere;
        }

        .error {
            background: #ffebee;
            color: #c62828;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a {
            color: #ff6b35;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>
    <div class="page-header">
        <h1>Food Platform</h1>
    </div>

    <main class="container">
        <div class="auth-box">
            <h1>Customer Login</h1>
            <p>Login to view your orders and track your orders.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    Login
                </button>
            </form>

            <div id="errorMessage" class="message error" role="alert"></div>
            <div id="successMessage" class="message success" role="status"></div>

            <div class="register-link">
                Don't have an account?
                <a href="customer-register.html">Create Account</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginBtn = document.getElementById("loginBtn");
        const errorMessage = document.getElementById("errorMessage");
        const successMessage = document.getElementById("successMessage");

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = "block";
            successMessage.style.display = "none";
        }

        function getSupabaseClient() {
            // Support the client name used by the existing project.
            if (typeof db !== "undefined" && db && db.auth) {
                return db;
            }

            if (typeof supabaseClient !== "undefined" &&
                supabaseClient && supabaseClient.auth) {
                return supabaseClient;
            }

            return null;
        }

        loginForm.addEventListener("submit", async function(event) {
            event.preventDefault();

            errorMessage.style.display = "none";
            successMessage.style.display = "none";

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            if (!email || !password) {
                showError("Please enter your email and password.");
                return;
            }

            const client = getSupabaseClient();

            if (!client) {
                showError(
                    "Supabase connection was not found. Check supabase.js " +
                    "and confirm that it creates the client as db or supabaseClient."
                );
                console.error(
                    "Supabase client missing. Check supabase.js and browser Console."
                );
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = "Logging in...";

            try {
                const { data, error } = await client.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    throw error;
                }

                if (!data || !data.user) {
                    throw new Error("Login was not completed. Please try again.");
                }

                successMessage.textContent = "Login successful. Opening your orders...";
                successMessage.style.display = "block";

                // Allow Supabase to save the session before navigating.
                window.location.assign("my-orders.html");

            } catch (error) {
                console.error("Customer login error:", error);

                let message = error && error.message
                    ? error.message
                    : "Login failed. Please try again.";

                if (message.toLowerCase().includes("invalid login credentials")) {
                    message = "Email or password is incorrect. Please check and try again.";
                } else if (
                    message.toLowerCase().includes("email not confirmed")
                ) {
                    message = "Your email has not been confirmed. Please complete email confirmation first.";
                } else if (
                    message.toLowerCase().includes("failed to fetch")
                ) {
                    message = "Cannot connect to Supabase. Check your internet connection and Supabase settings.";
                }

                showError(message);

                loginBtn.disabled = false;
                loginBtn.textContent = "Login";
            }
        });
    </script>
</body>
</html>
