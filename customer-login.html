
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ff6b35">
    <title>Customer Login | Food Platform</title>
    <link rel="stylesheet" href="style.css">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #f7f8fa;
            font-family: Arial, sans-serif;
        }

        .page-header {
            background: #ff6b35;
            color: white;
            padding: 18px 20px;
            text-align: center;
        }

        .page-header h1 {
            margin: 0;
            font-size: 25px;
        }

        .language-bar {
            display: flex;
            justify-content: flex-end;
            max-width: 500px;
            margin: 18px auto 0;
            padding: 0 15px;
        }

        .language-bar select {
            padding: 9px 12px;
            border: 1px solid #ddd;
            border-radius: 9px;
            background: white;
            font-size: 14px;
        }

        .container { padding: 0 15px 35px; }

        .auth-box {
            max-width: 450px;
            margin: 18px auto;
            background: white;
            padding: 28px 24px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,.07);
        }

        .login-icon {
            width: 65px;
            height: 65px;
            margin: 0 auto 15px;
            border-radius: 50%;
            background: #fff0e9;
            color: #ff6b35;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 30px;
        }

        .auth-box h2 {
            text-align: center;
            margin: 0 0 10px;
            color: #222;
        }

        .intro {
            text-align: center;
            color: #777;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
            background: white;
        }

        .form-group input:focus {
            border-color: #ff6b35;
            box-shadow: 0 0 0 3px rgba(255,107,53,.12);
        }

        .password-wrap { position: relative; }

        .password-wrap input { padding-right: 85px; }

        .show-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #ff6b35;
            font-weight: bold;
            cursor: pointer;
            padding: 8px 4px;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #ff6b35;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover { background: #ed5725; }

        .login-btn:disabled,
        .forgot-btn:disabled {
            opacity: .65;
            cursor: wait;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            display: none;
            overflow-wrap: anywhere;
            line-height: 1.5;
            font-size: 14px;
        }

        .error { background: #ffebee; color: #b71c1c; }
        .success { background: #e8f5e9; color: #1b5e20; }

        .register-link {
            text-align: center;
            margin-top: 22px;
            line-height: 1.8;
            color: #666;
        }

        .register-link a,
        .back-home {
            color: #ff6b35;
            font-weight: bold;
            text-decoration: none;
        }

        .back-home {
            display: block;
            text-align: center;
            margin-top: 18px;
        }

        .forgot-wrap {
            text-align: right;
            margin-top: -7px;
            margin-bottom: 20px;
        }

        .forgot-btn {
            background: none;
            border: none;
            color: #ff6b35;
            cursor: pointer;
            font-size: 14px;
            padding: 5px 0;
        }

        @media (max-width: 480px) {
            .auth-box {
                padding: 24px 18px;
                margin-top: 12px;
            }
            .page-header h1 { font-size: 22px; }
        }
    </style>
</head>

<body>
    <header class="page-header">
        <h1>🍽️ Food Platform</h1>
    </header>

    <div class="language-bar">
        <select id="languageSelect" aria-label="Select language">
            <option value="en">🇬🇧 English</option>
            <option value="sw">🇹🇿 Kiswahili</option>
        </select>
    </div>

    <main class="container">
        <section class="auth-box">
            <div class="login-icon">👤</div>

            <h2 id="pageTitle">Customer Login</h2>
            <p class="intro" id="introText">
                Login to view your orders and track deliveries.
            </p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email" id="emailLabel">Email address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password" id="passwordLabel">Password</label>
                    <div class="password-wrap">
                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button
                            type="button"
                            class="show-password"
                            id="showPassword"
                        >Show</button>
                    </div>
                </div>

                <div class="forgot-wrap">
                    <button type="button" class="forgot-btn" id="forgotBtn">
                        Forgot password?
                    </button>
                </div>

                <button type="submit" class="login-btn" id="loginBtn">
                    Login
                </button>
            </form>

            <div id="errorMessage" class="message error" role="alert"></div>
            <div id="successMessage" class="message success" role="status"></div>

            <div class="register-link">
                <span id="registerText">Don't have an account?</span>
                <a href="customer-register.html" id="registerLink">
                    Create Account
                </a>
            </div>

            <a href="index.html" class="back-home" id="homeLink">
                ← Back to Home
            </a>
        </section>
    </main>

    <!-- Load Supabase library FIRST -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Then load your configuration -->
    <script src="supabase.js"></script>

    <script>
        const translations = {
            en: {
                title: "Customer Login",
                intro: "Login to view your orders and track deliveries.",
                email: "Email address",
                emailPlaceholder: "Enter your email",
                password: "Password",
                passwordPlaceholder: "Enter your password",
                show: "Show",
                hide: "Hide",
                forgot: "Forgot password?",
                login: "Login",
                loggingIn: "Logging in...",
                registerText: "Don't have an account?",
                registerLink: "Create Account",
                home: "← Back to Home",
                required: "Please enter your email and password.",
                noClient: "Supabase could not load. Check your internet connection and supabase.js.",
                invalid: "Email or password is incorrect. Please try again.",
                unconfirmed: "Please confirm your email before logging in.",
                network: "Cannot connect to the server. Check your internet connection.",
                failed: "Login failed. Please try again.",
                resetEmail: "Enter your email address first.",
                resetSending: "Sending reset link...",
                resetSent: "If the account exists, a reset email has been requested. Check your inbox.",
                resetFailed: "Could not request a password reset. Please try again."
            },
            sw: {
                title: "Ingia kwa Mteja",
                intro: "Ingia kuona oda zako na kufuatilia usafirishaji.",
                email: "Barua pepe",
                emailPlaceholder: "Weka barua pepe yako",
                password: "Nenosiri",
                passwordPlaceholder: "Weka nenosiri lako",
                show: "Onyesha",
                hide: "Ficha",
                forgot: "Umesahau nenosiri?",
                login: "Ingia",
                loggingIn: "Inaingia...",
                registerText: "Huna akaunti?",
                registerLink: "Fungua Akaunti",
                home: "← Rudi Mwanzo",
                required: "Tafadhali weka barua pepe na nenosiri.",
                noClient: "Supabase haijapakia. Kagua intaneti na faili supabase.js.",
                invalid: "Barua pepe au nenosiri si sahihi. Jaribu tena.",
                unconfirmed: "Thibitisha barua pepe yako kabla ya kuingia.",
                network: "Imeshindikana kuunganisha na seva. Kagua intaneti.",
                failed: "Kuingia kumeshindikana. Jaribu tena.",
                resetEmail: "Weka barua pepe yako kwanza.",
                resetSending: "Inatuma ombi...",
                resetSent: "Ikiwa akaunti ipo, ombi limetumwa. Kagua barua pepe yako.",
                resetFailed: "Imeshindikana kuomba kubadilisha nenosiri. Jaribu tena."
            }
        };

        let language = localStorage.getItem("foodLanguage") || "en";

        const loginForm = document.getElementById("loginForm");
        const loginBtn = document.getElementById("loginBtn");
        const errorMessage = document.getElementById("errorMessage");
        const successMessage = document.getElementById("successMessage");
        const passwordInput = document.getElementById("password");
        const showPasswordBtn = document.getElementById("showPassword");
        const forgotBtn = document.getElementById("forgotBtn");
        const languageSelect = document.getElementById("languageSelect");

        // Always get the shared client from supabase.js.
        function getSupabaseClient() {
            if (
                window.db &&
                window.db.auth &&
                typeof window.db.auth.signInWithPassword === "function"
            ) {
                return window.db;
            }

            console.error(
                "Supabase client missing. Check the Supabase library and supabase.js."
            );

            return null;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = "block";
            successMessage.style.display = "none";
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = "block";
            errorMessage.style.display = "none";
        }

        function clearMessages() {
            errorMessage.style.display = "none";
            successMessage.style.display = "none";
        }

        function updateLanguage() {
            const t = translations[language] || translations.en;

            document.documentElement.lang = language;
            document.getElementById("pageTitle").textContent = t.title;
            document.getElementById("introText").textContent = t.intro;
            document.getElementById("emailLabel").textContent = t.email;
            document.getElementById("email").placeholder = t.emailPlaceholder;
            document.getElementById("passwordLabel").textContent = t.password;
            passwordInput.placeholder = t.passwordPlaceholder;

            showPasswordBtn.textContent =
                passwordInput.type === "password" ? t.show : t.hide;

            forgotBtn.textContent = t.forgot;
            document.getElementById("registerText").textContent = t.registerText;
            document.getElementById("registerLink").textContent = t.registerLink;
            document.getElementById("homeLink").textContent = t.home;
            languageSelect.value = language;

            if (!loginBtn.disabled) {
                loginBtn.textContent = t.login;
            }
        }

        languageSelect.addEventListener("change", function () {
            language = this.value;
            localStorage.setItem("foodLanguage", language);
            updateLanguage();
            clearMessages();
        });

        showPasswordBtn.addEventListener("click", function () {
            passwordInput.type =
                passwordInput.type === "password" ? "text" : "password";
            updateLanguage();
        });

        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();
            clearMessages();

            const t = translations[language] || translations.en;
            const email = document.getElementById("email").value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showError(t.required);
                return;
            }

            const client = getSupabaseClient();

            if (!client) {
                showError(t.noClient);
                return;
            }

            loginBtn.disabled = true;
            loginBtn.textContent = t.loggingIn;

            try {
                const { data, error } =
                    await client.auth.signInWithPassword({
                        email: email,
                        password: password
                    });

                if (error) {
                    const msg = String(error.message || "").toLowerCase();

                    if (msg.includes("email not confirmed")) {
                        throw new Error(t.unconfirmed);
                    }

                    if (
                        msg.includes("invalid login credentials") ||
                        msg.includes("invalid email or password")
                    ) {
                        throw new Error(t.invalid);
                    }

                    if (
                        msg.includes("failed to fetch") ||
                        msg.includes("network") ||
                        msg.includes("fetch")
                    ) {
                        throw new Error(t.network);
                    }

                    throw error;
                }

                if (!data || !data.user) {
                    throw new Error(t.failed);
                }

                showSuccess(
                    language === "sw"
                        ? "Umeingia. Inafungua oda zako..."
                        : "Login successful. Opening your orders..."
                );

                window.location.assign("my-orders.html");

            } catch (error) {
                console.error("Customer login error:", error);
                showError(error.message || t.failed);
                loginBtn.disabled = false;
                loginBtn.textContent = t.login;
            }
        });

        forgotBtn.addEventListener("click", async function () {
            clearMessages();

            const t = translations[language] || translations.en;
            const email = document.getElementById("email").value.trim();

            if (!email) {
                showError(t.resetEmail);
                document.getElementById("email").focus();
                return;
            }

            const client = getSupabaseClient();

            if (!client) {
                showError(t.noClient);
                return;
            }

            forgotBtn.disabled = true;
            forgotBtn.textContent = t.resetSending;

            try {
                const redirectUrl = new URL(
                    "customer-account.html",
                    window.location.href
                ).href;

                const { error } = await client.auth.resetPasswordForEmail(
                    email,
                    { redirectTo: redirectUrl }
                );

                if (error) throw error;

                showSuccess(t.resetSent);

            } catch (error) {
                console.error("Password reset error:", error);
                showError(t.resetFailed);

            } finally {
                forgotBtn.disabled = false;
                forgotBtn.textContent = t.forgot;
            }
        });

        updateLanguage();
    </script>
</body>
</html>
