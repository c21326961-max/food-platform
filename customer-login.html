<title>Customer Login | Food Platform</title>

<link rel="stylesheet" href="style.css">

<style>
    .auth-box {
        max-width: 450px;
        margin: 50px auto;
        background: white;
        padding: 25px;
        border-radius: 18px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .auth-box h1 {
        margin-bottom: 8px;
    }

    .auth-box p {
        color: #777;
        margin-bottom: 25px;
    }

    .form-group {
        margin-bottom: 18px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        font-weight: bold;
    }

    .form-group input {
        width: 100%;
        box-sizing: border-box;
        padding: 14px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 16px;
        outline: none;
    }

    .form-group input:focus {
        border-color: #ff6b35;
    }

    .login-btn {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 10px;
        background: #ff6b35;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .login-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .message {
        margin-top: 15px;
        padding: 12px;
        border-radius: 10px;
        display: none;
        overflow-wrap: anywhere;
    }

    .error {
        background: #ffebee;
        color: #c62828;
    }

    .success {
        background: #e8f5e9;
        color: #2e7d32;
    }

    .register-link {
        text-align: center;
        margin-top: 20px;
    }

    .register-link a {
        color: #ff6b35;
        font-weight: bold;
        text-decoration: none;
    }
</style>

<script src="./language.js" defer></script>
</head>

<body>

```
<div class="page-header">
    <h1>🍽️ Food Platform</h1>
</div>

<main class="container">

    <div class="auth-box">

        <h1>👤 Customer Login</h1>

        <p>
            Login to view your orders and track your deliveries.
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button
                type="submit"
                class="login-btn"
                id="loginBtn"
            >
                🔐 Login
            </button>

        </form>

        <div
            id="errorMessage"
            class="message error"
            role="alert"
        ></div>

        <div
            id="successMessage"
            class="message success"
            role="status"
        ></div>

        <div class="register-link">
            Don't have an account?
            <a href="customer-register.html">Create Account</a>
        </div>

    </div>

</main>

<!-- Load Supabase library first -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Initialize the shared Supabase client -->
<script src="supabase.js"></script>

<script>
    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const errorMessage = document.getElementById("errorMessage");
    const successMessage = document.getElementById("successMessage");

    loginForm.addEventListener("submit", async function(event) {
        event.preventDefault();

        errorMessage.style.display = "none";
        successMessage.style.display = "none";

        // Confirm Supabase client exists before login.
        if (
            !window.db ||
            !window.db.auth ||
            typeof window.db.auth.signInWithPassword !== "function"
        ) {
            errorMessage.textContent =
                "Supabase haijapakia. Hakikisha una intaneti, kisha jaribu tena.";
            errorMessage.style.display = "block";
            return;
        }

        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        loginBtn.disabled = true;
        loginBtn.textContent = "⏳ Logging in...";

        try {
            const { data, error } =
                await window.db.auth.signInWithPassword({
                    email: email,
                    password: password
                });

            if (error) {
                throw error;
            }

            successMessage.textContent = "✅ Login successful!";
            successMessage.style.display = "block";

            setTimeout(function() {
                window.location.href = "my-orders.html";
            }, 700);

        } catch (error) {
            console.error("Login error:", error);

            errorMessage.textContent =
                "❌ " + (
                    error.message || "Login failed. Please try again."
                );

            errorMessage.style.display = "block";

        } finally {
            loginBtn.disabled = false;
            loginBtn.textContent = "🔐 Login";
        }
    });
</script>
