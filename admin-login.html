<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Food Platform</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 390px;
            background: white;
            padding: 28px 22px;
            border-radius: 14px;
            box-shadow: 0 5px 25px rgba(0,0,0,.10);
        }

        .brand {
            text-align: center;
            margin-bottom: 25px;
        }

        .brand h1 {
            margin: 0 0 7px;
            color: #ff6b00;
            font-size: 25px;
        }

        .brand p {
            margin: 0;
            color: #777;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 15px 0 7px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #ff6b00;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #ff6b00;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 11px;
            border-radius: 7px;
            font-size: 14px;
            text-align: center;
        }

        .error {
            display: block;
            background: #ffe8e8;
            color: #c62828;
        }

        .success {
            display: block;
            background: #e8f7ed;
            color: #218838;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        .back:hover {
            color: #ff6b00;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="brand">
        <h1>Food Platform</h1>
        <p>Administrator Login</p>
    </div>

    <form id="loginForm">

        <label for="email">Admin Email</label>
        <input
            type="email"
            id="email"
            placeholder="Enter admin email"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            placeholder="Enter password"
            required
        >

        <button type="submit" id="loginBtn">
            Login
        </button>

    </form>

    <div id="message" class="message"></div>

    <a href="index.html" class="back">
        ← Back to Food Platform
    </a>

</div>

<script>

const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const message = document.getElementById("message");

function showMessage(text, type) {

    message.textContent = text;

    message.className = "message " + type;

}

loginForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {

        showMessage(
            "Please enter email and password.",
            "error"
        );

        return;
    }

    loginBtn.disabled = true;
    loginBtn.textContent = "Logging in...";

    showMessage("", "");

    try {

        const { data, error } = await db.auth.signInWithPassword({
            email: email,
            password: password
        });

        if (error) {
            throw error;
        }

        if (!data.user) {
            throw new Error("Login failed.");
        }

        // Check whether this user is actually an admin
        const { data: admin, error: adminError } = await db
            .from("food_admins")
            .select("id, full_name, email")
            .eq("id", data.user.id)
            .maybeSingle();

        if (adminError) {
            throw adminError;
        }

        if (!admin) {

            await db.auth.signOut();

            throw new Error(
                "This account is not registered as a Food Platform admin."
            );
        }

        showMessage(
            "Login successful. Opening dashboard...",
            "success"
        );

        setTimeout(function() {

            window.location.href = "admin-dashboard.html";

        }, 700);

    } catch (error) {

        console.error(error);

        showMessage(
            error.message || "Login failed. Please try again.",
            "error"
        );

        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
    }

});

</script>

</body>
</html>
