
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant | Food Platform</title>

    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="./language.js" defer></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #f5f7fb;
            color: #222;
            font-family: Arial, sans-serif;
        }

        .restaurant-hero {
            background: linear-gradient(135deg, #f97316, #ea580c);
            color: white;
            padding: 22px;
        }

        .header-content, .container {
            max-width: 1100px;
            margin: auto;
        }

        .back-link {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .restaurant-logo {
            display: none;
            width: 76px;
            height: 76px;
            margin-top: 16px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid white;
            background: white;
        }

        .restaurant-title {
            margin-top: 15px;
            font-size: 28px;
            font-weight: 700;
        }

        .restaurant-description {
            margin-top: 8px;
            line-height: 1.5;
        }

        .restaurant-details {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .detail {
            background: rgba(255,255,255,.18);
            padding: 7px 10px;
            border-radius: 8px;
            font-size: 13px;
        }

        .container {
            padding: 22px 16px 90px;
        }

        .menu-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title { margin: 0; }

        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 17px;
        }

        .food-card {
            overflow: hidden;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 14px rgba(0,0,0,.07);
        }

        .food-image, .food-placeholder {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .food-placeholder {
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eee;
            color: #777;
        }

        .food-info { padding: 15px; }
        .food-name { font-size: 18px; font-weight: bold; }
        .food-description { margin-top: 7px; color: #777; font-size: 14px; line-height: 1.5; }
        .food-category { margin-top: 8px; color: #666; font-size: 13px; }
        .food-price { margin-top: 10px; color: #f97316; font-size: 19px; font-weight: bold; }

        .availability {
            display: inline-block;
            margin-top: 10px;
            padding: 5px 8px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: bold;
            background: #dcfce7;
            color: #166534;
        }

        .cart-button {
            width: 100%;
            margin-top: 12px;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: #f97316;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .cart-button:hover { background: #ea580c; }

        .loading, .empty, .error-box {
            padding: 24px 16px;
            text-align: center;
            background: white;
            border-radius: 12px;
            line-height: 1.6;
        }

        .loading, .empty { color: #777; }
        .error-box { background: #fee2e2; color: #991b1b; }

        .cart-count {
            position: fixed;
            right: 18px;
            bottom: 24px;
            z-index: 20;
            padding: 13px 18px;
            border: none;
            border-radius: 30px;
            background: #f97316;
            color: white;
            box-shadow: 0 4px 14px rgba(0,0,0,.2);
            font-weight: bold;
            cursor: pointer;
        }

        @media (max-width: 600px) {
            .restaurant-title { font-size: 24px; }
            .menu-grid { grid-template-columns: 1fr; }
            .food-image, .food-placeholder { height: 200px; }
        }
    </style>
</head>

<body>

<header class="restaurant-hero">
    <div class="header-content">
        <a href="index.html" class="back-link">← Back</a>

        <img id="restaurantLogo" class="restaurant-logo" alt="Restaurant logo">

        <div id="restaurantName" class="restaurant-title">
            Loading restaurant...
        </div>

        <div id="restaurantDescription" class="restaurant-description">
            Please wait...
        </div>

        <div id="restaurantDetails" class="restaurant-details"></div>
    </div>
</header>

<main class="container">
    <div class="menu-header">
        <h2 class="section-title">Our Menu</h2>
    </div>

    <div id="menuContainer">
        <div class="loading">Loading menu...</div>
    </div>
</main>

<button id="cartButton" class="cart-count" type="button" onclick="goToCart()">
    Cart (<span id="cartCount">0</span>)
</button>

<script>
"use strict";

/* SUPABASE */
const db = window.db;

/* VARIABLES */
let restaurantId = null;
let restaurantData = null;
let menuData = [];

/* ELEMENTS */
const restaurantName = document.getElementById("restaurantName");
const restaurantDescription = document.getElementById("restaurantDescription");
const restaurantDetails = document.getElementById("restaurantDetails");
const restaurantLogo = document.getElementById("restaurantLogo");
const menuContainer = document.getElementById("menuContainer");
const cartCount = document.getElementById("cartCount");

/* GET ID FROM URL */
function getRestaurantId() {
    const params = new URLSearchParams(window.location.search);

    return (
        params.get("id") ||
        params.get("restaurant_id") ||
        params.get("restaurantId")
    );
}

/* LOAD RESTAURANT */
async function loadRestaurant() {
    try {
        if (!db || typeof db.from !== "function") {
            throw new Error(
                "Supabase haijaunganishwa. Kagua supabase.js."
            );
        }

        restaurantId = getRestaurantId();

        let query = db
            .from("food_restaurants")
            .select("*");

        if (restaurantId) {
            query = query.eq("id", restaurantId);
        } else {
            /*
             * Fallback ya muda tu:
             * ID ikiwa haipo, pata restaurant moja ili
             * kutambua kama database ina restaurants.
             * Baadaye index.html itumie ID sahihi.
             */
            query = query.limit(1);
        }

        const { data, error } = await query.maybeSingle();

        if (error) throw error;

        if (!data) {
            restaurantName.textContent = "Restaurant not found";
            restaurantDescription.textContent = "";
            menuContainer.innerHTML = `
                <div class="empty">
                    Hakuna restaurant iliyopatikana.
                    Fungua ukurasa wa restaurants na uchague restaurant.
                </div>
            `;
            return;
        }

        restaurantData = data;
        restaurantId = data.id;

        /* Hifadhi ID kwenye URL bila kuanzisha upya ukurasa */
        if (!getRestaurantId()) {
            const url = new URL(window.location.href);
            url.searchParams.set("id", restaurantId);
            window.history.replaceState({}, "", url);
        }

        renderRestaurant();
        await loadMenu();

    } catch (error) {
        console.error("Restaurant loading error:", error);

        restaurantName.textContent = "Unable to load restaurant";
        restaurantDescription.textContent = "";

        menuContainer.innerHTML = `
            <div class="error-box">
                Imeshindwa kufungua restaurant.<br>
                ${escapeHTML(error.message || "Unknown error")}
            </div>
        `;
    }
}

/* RESTAURANT DETAILS */
function renderRestaurant() {
    restaurantName.textContent = restaurantData.name || "Restaurant";

    restaurantDescription.textContent =
        restaurantData.description || "Delicious food near you.";

    restaurantDetails.replaceChildren();

    if (restaurantData.logo_url) {
        restaurantLogo.src = restaurantData.logo_url;
        restaurantLogo.style.display = "block";

        restaurantLogo.onerror = () => {
            restaurantLogo.style.display = "none";
        };
    }

    if (restaurantData.rating !== null &&
        restaurantData.rating !== undefined) {
        addDetail("Rating " + Number(restaurantData.rating).toFixed(1));
    }

    if (restaurantData.address) addDetail(restaurantData.address);
    if (restaurantData.phone) addDetail(restaurantData.phone);

    if (restaurantData.opening_time && restaurantData.closing_time) {
        addDetail(
            restaurantData.opening_time + " - " +
            restaurantData.closing_time
        );
    }

    if (restaurantData.delivery_available) {
        addDetail(
            "Delivery TSh " +
            Number(restaurantData.delivery_fee || 0).toLocaleString()
        );
    } else {
        addDetail("Pickup available");
    }
}

function addDetail(text) {
    const div = document.createElement("div");
    div.className = "detail";
    div.textContent = text;
    restaurantDetails.appendChild(div);
}

/* LOAD MENU */
async function loadMenu() {
    menuContainer.innerHTML = `
        <div class="loading">Loading menu...</div>
    `;

    try {
        const { data, error } = await db
            .from("food_menu")
            .select("*")
            .eq("restaurant_id", restaurantId)
            .eq("is_available", true)
            .order("created_at", { ascending: false });

        if (error) throw error;

        menuData = data || [];

        if (menuData.length === 0) {
            menuContainer.innerHTML = `
                <div class="empty">
                    Bado hakuna chakula kinachopatikana kwenye restaurant hii.
                </div>
            `;
            return;
        }

        renderMenu();

    } catch (error) {
        console.error("Menu loading error:", error);

        menuContainer.innerHTML = `
            <div class="error-box">
                Imeshindwa kupakia menu.<br>
                ${escapeHTML(error.message || "Unknown error")}
            </div>
        `;
    }
}

/* DISPLAY MENU */
function renderMenu() {
    menuContainer.replaceChildren();

    const grid = document.createElement("div");
    grid.className = "menu-grid";

    menuData.forEach(food => {
        const card = document.createElement("article");
        card.className = "food-card";

        if (food.image_url) {
            const image = document.createElement("img");
            image.className = "food-image";
            image.src = food.image_url;
            image.alt = food.name || "Food";
            image.loading = "lazy";

            image.onerror = () => {
                const placeholder = document.createElement("div");
                placeholder.className = "food-placeholder";
                placeholder.textContent = "Food image unavailable";
                image.replaceWith(placeholder);
            };

            card.appendChild(image);
        } else {
            const placeholder = document.createElement("div");
            placeholder.className = "food-placeholder";
            placeholder.textContent = "Food";
            card.appendChild(placeholder);
        }

        const info = document.createElement("div");
        info.className = "food-info";

        const name = document.createElement("div");
        name.className = "food-name";
        name.textContent = food.name || "Food";

        const description = document.createElement("div");
        description.className = "food-description";
        description.textContent = food.description || "No description.";

        const category = document.createElement("div");
        category.className = "food-category";
        category.textContent = "Category: " + (food.category || "Other");

        const price = document.createElement("div");
        price.className = "food-price";
        price.textContent =
            "TSh " + Number(food.price || 0).toLocaleString();

        const availability = document.createElement("span");
        availability.className = "availability";
        availability.textContent = "Available";

        const button = document.createElement("button");
        button.type = "button";
        button.className = "cart-button";
        button.textContent = "Add to Cart";
        button.addEventListener("click", () => addToCart(food));

        info.append(name, description, category, price, availability, button);
        card.appendChild(info);
        grid.appendChild(card);
    });

    menuContainer.appendChild(grid);
}

/* ADD TO CART */
function addToCart(food) {
    if (!food.is_available) {
        alert("Chakula hiki hakipatikani kwa sasa.");
        return;
    }

    let cart;

    try {
        cart = JSON.parse(localStorage.getItem("foodCart") || "[]");
        if (!Array.isArray(cart)) cart = [];
    } catch {
        cart = [];
    }

    if (
        cart.length > 0 &&
        cart.some(item =>
            String(item.restaurant_id) !== String(food.restaurant_id)
        )
    ) {
        const replace = confirm(
            "Cart yako ina bidhaa za restaurant nyingine. Unataka kuziondoa na kuanza cart mpya?"
        );

        if (!replace) return;
        cart = [];
    }

    const existing = cart.find(
        item => String(item.menu_id || item.id) === String(food.id)
    );

    if (existing) {
        existing.quantity = Number(existing.quantity || 0) + 1;
    } else {
        cart.push({
            menu_id: food.id,
            restaurant_id: food.restaurant_id || restaurantId,
            food_name: food.name,
            price: Number(food.price || 0),
            quantity: 1,
            image_url: food.image_url || ""
        });
    }

    localStorage.setItem("foodCart", JSON.stringify(cart));
    updateCartCount();

    alert((food.name || "Food") + " imeongezwa kwenye cart.");
}

/* CART COUNT */
function updateCartCount() {
    let cart;

    try {
        cart = JSON.parse(localStorage.getItem("foodCart") || "[]");
        if (!Array.isArray(cart)) cart = [];
    } catch {
        cart = [];
    }

    const count = cart.reduce(
        (sum, item) => sum + Math.max(0, Number(item.quantity || 0)),
        0
    );

    cartCount.textContent = count;
}

/* NAVIGATION */
function goToCart() {
    window.location.href = "cart.html";
}

/* SAFE TEXT */
function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

/* START */
loadRestaurant();
updateCartCount();
</script>

</body>
</html>
