```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Restaurant | Food Platform</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
.restaurant-hero{background:#ff6b35;color:white;padding:20px}
.top-actions{display:flex;align-items:center;justify-content:space-between;gap:12px}
#languageSelect{padding:8px 10px;border-radius:8px;font-weight:bold}
.back-link{color:white;text-decoration:none}
.restaurant-title{margin-top:14px;font-size:27px;font-weight:bold}
.restaurant-description{margin-top:7px;line-height:1.5}
.restaurant-details{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px}
.detail{background:#ffffff29;padding:6px 10px;border-radius:8px;font-size:13px}
.restaurant-logo{width:70px;height:70px;border-radius:50%;object-fit:cover;margin-top:14px}
.menu-header{margin-bottom:15px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.food-card{background:white;border-radius:13px;overflow:hidden;box-shadow:0 3px 12px #00000012}
.food-image,.food-placeholder{width:100%;height:175px;object-fit:cover;display:block}
.food-placeholder{background:#f1f1f1;display:flex;align-items:center;justify-content:center;color:#777}
.food-info{padding:14px}
.food-name{font-size:18px;font-weight:bold}
.food-description{margin-top:6px;color:#777;font-size:14px}
.food-category{margin-top:7px;color:#666;font-size:13px}
.food-price{margin-top:9px;color:#ff6b35;font-size:18px;font-weight:bold}
.availability{display:inline-block;margin-top:9px;padding:5px 8px;border-radius:7px;font-size:12px}
.available{background:#dcfce7;color:#166534}
.cart-button{width:100%;margin-top:12px;padding:11px;border:0;border-radius:8px;background:#ff6b35;color:white;font-weight:bold;cursor:pointer}
.loading,.empty{padding:30px 15px;text-align:center;background:white;border-radius:12px;color:#777}
.error-box{background:#fee2e2;color:#991b1b;padding:15px;border-radius:12px;overflow-wrap:anywhere}
.cart-count{position:fixed;right:18px;bottom:25px;background:#ff6b35;color:white;padding:10px 14px;border-radius:25px;box-shadow:0 4px 14px #0003;font-weight:bold;cursor:pointer;z-index:20}
.toast-message{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:#222;color:white;padding:12px 16px;border-radius:10px;z-index:1000;max-width:90%;text-align:center}
@media(max-width:600px){.restaurant-title{font-size:23px}.menu-grid{grid-template-columns:1fr}.food-image,.food-placeholder{height:190px}}
</style>
</head>

<body>

<header class="restaurant-hero">
    <div class="top-actions">
        <a href="index.html" class="back-link" id="backLink">← Back</a>
        <select id="languageSelect" aria-label="Choose language">
            <option value="en">English</option>
            <option value="sw">Kiswahili</option>
        </select>
    </div>

    <img id="restaurantLogo" class="restaurant-logo" style="display:none" alt="Restaurant logo">
    <div id="restaurantName" class="restaurant-title">Loading restaurant...</div>
    <div id="restaurantDescription" class="restaurant-description">Loading...</div>
    <div id="restaurantDetails" class="restaurant-details"></div>
</header>

<main class="container">
    <div class="menu-header">
        <h2 class="section-title" id="menuHeading">Menu</h2>
    </div>
    <div id="menuContainer">
        <div class="loading" id="menuLoading">Loading menu...</div>
    </div>
</main>

<div id="cartButton" class="cart-count" role="button" tabindex="0" onclick="goToCart()">
    <span id="cartLabel">Cart</span> (<span id="cartCount">0</span>)
</div>

<script>
"use strict";

/* SUPABASE SETTINGS */
const SUPABASE_URL = "https://ienquzigbawhvthnirtj.supabase.co";
const SUPABASE_KEY = "sb_publishable_tSbACTjOICJlthE03XmGCA_sIgigXup";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/*
 IMPORTANT FIX:
 Do not call t() while translations is being created.
 All translation values below are plain strings.
*/
const translations = {
    en: {
        back:"← Back", menu:"Menu", cart:"Cart",
        loadingRestaurant:"Loading restaurant...",
        loading:"Loading...", loadingMenu:"Loading menu...",
        restaurantNotFound:"Restaurant not found",
        restaurantIdMissing:"Restaurant ID is missing from the link.",
        failedRestaurant:"Failed to load restaurant.",
        restaurantDoesNotExist:"This restaurant does not exist.",
        unableRestaurant:"Unable to load restaurant.",
        delicious:"Delicious food near you.",
        rating:"Rating", delivery:"Delivery", pickup:"Pickup",
        failedMenu:"Failed to load menu.",
        noFood:"No food available right now.",
        food:"Food", noDescription:"No description available.",
        category:"Category", available:"Available",
        addToCart:"Add to Cart", unavailable:"This food is currently unavailable.",
        anotherRestaurant:"Your cart already contains food from another restaurant. Complete or clear that cart first.",
        added:"added to cart", other:"Other",
        requestTimeout:"The request took too long. Check your internet connection and try again.",
        retry:"Try Again"
    },
    sw: {
        back:"← Rudi", menu:"Menyu", cart:"Kikapu",
        loadingRestaurant:"Inapakia mgahawa...",
        loading:"Inapakia...", loadingMenu:"Inapakia menyu...",
        restaurantNotFound:"Mgahawa haujapatikana",
        restaurantIdMissing:"Kitambulisho cha mgahawa hakipo kwenye link.",
        failedRestaurant:"Imeshindwa kupakia mgahawa.",
        restaurantDoesNotExist:"Mgahawa huu haupo.",
        unableRestaurant:"Haiwezekani kupakia mgahawa.",
        delicious:"Chakula kitamu karibu nawe.",
        rating:"Ukadiriaji", delivery:"Usafirishaji", pickup:"Kuchukua mwenyewe",
        failedMenu:"Imeshindwa kupakia menyu.",
        noFood:"Hakuna chakula kinachopatikana kwa sasa.",
        food:"Chakula", noDescription:"Hakuna maelezo.",
        category:"Aina", available:"Kinapatikana",
        addToCart:"Weka Kikapuni", unavailable:"Chakula hiki hakipatikani kwa sasa.",
        anotherRestaurant:"Kikapu chako kina chakula kutoka mgahawa mwingine. Kamilisha au futa kikapu hicho kwanza.",
        added:"kimeongezwa kikapuni", other:"Nyingine",
        requestTimeout:"Ombi limechukua muda mrefu. Angalia intaneti kisha ujaribu tena.",
        retry:"Jaribu Tena"
    }
};

let currentLanguage = localStorage.getItem("foodLanguage") || "en";
if (!["en","sw"].includes(currentLanguage)) currentLanguage = "en";

let restaurantId = null;
let restaurantData = null;
let menuData = [];

const $ = id => document.getElementById(id);

function t(key) {
    return translations[currentLanguage]?.[key] || translations.en[key] || key;
}

function escapeHTML(value) {
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function showToast(message) {
    let toast = $("toastMessage");
    if (!toast) {
        toast = document.createElement("div");
        toast.id = "toastMessage";
        toast.className = "toast-message";
        toast.setAttribute("role","status");
        document.body.appendChild(toast);
    }
    toast.textContent = message;
    toast.hidden = false;
    clearTimeout(showToast.timer);
    showToast.timer = setTimeout(() => toast.hidden = true, 2500);
}

function applyLanguage() {
    document.documentElement.lang = currentLanguage;
    $("backLink").textContent = t("back");
    $("menuHeading").textContent = t("menu");
    $("cartLabel").textContent = t("cart");
    $("languageSelect").value = currentLanguage;

    if (restaurantData) renderRestaurant();
    if (menuData.length) renderMenu();
    else if (!restaurantData) {
        $("restaurantName").textContent = t("loadingRestaurant");
        $("restaurantDescription").textContent = t("loading");
    }

    updateCartCount();
}

$("languageSelect").addEventListener("change", function() {
    currentLanguage = this.value === "sw" ? "sw" : "en";
    localStorage.setItem("foodLanguage", currentLanguage);
    applyLanguage();
});

/* RESTAURANT ID FROM URL */
function getRestaurantId() {
    return new URLSearchParams(window.location.search).get("id");
}

/* RESTAURANT DETAILS */
function addDetail(text) {
    const div = document.createElement("div");
    div.className = "detail";
    div.textContent = text;
    $("restaurantDetails").appendChild(div);
}

function renderRestaurant() {
    if (!restaurantData) return;

    $("restaurantName").textContent = restaurantData.name || "Restaurant";
    $("restaurantDescription").textContent =
        restaurantData.description || t("delicious");

    $("restaurantDetails").replaceChildren();

    const logoUrl = restaurantData.logo_url;
    if (logoUrl) {
        $("restaurantLogo").src = logoUrl;
        $("restaurantLogo").style.display = "block";
        $("restaurantLogo").onerror = () => {
            $("restaurantLogo").style.display = "none";
        };
    } else {
        $("restaurantLogo").style.display = "none";
    }

    if (restaurantData.rating !== null && restaurantData.rating !== undefined) {
        addDetail(t("rating") + ": " + Number(restaurantData.rating).toFixed(1));
    }

    if (restaurantData.address) addDetail(restaurantData.address);
    if (restaurantData.phone) addDetail(restaurantData.phone);

    if (restaurantData.opening_time && restaurantData.closing_time) {
        addDetail(restaurantData.opening_time + " - " + restaurantData.closing_time);
    }

    if (restaurantData.delivery_available) {
        addDetail(t("delivery") + ": TSh " +
            Number(restaurantData.delivery_fee || 0).toLocaleString());
    } else {
        addDetail(t("pickup"));
    }
}

/* SHOW A VISIBLE ERROR INSTEAD OF LOADING FOREVER */
function showError(container, message, retryFunction) {
    container.replaceChildren();

    const box = document.createElement("div");
    box.className = "error-box";

    const text = document.createElement("p");
    text.textContent = message;
    box.appendChild(text);

    if (retryFunction) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "cart-button";
        button.textContent = t("retry");
        button.onclick = retryFunction;
        box.appendChild(button);
    }

    container.appendChild(box);
}

/* LOAD RESTAURANT */
async function loadRestaurant() {
    restaurantId = getRestaurantId();

    if (!restaurantId) {
        $("restaurantName").textContent = t("restaurantNotFound");
        $("restaurantDescription").textContent = "";
        showError($("menuContainer"), t("restaurantIdMissing"));
        return;
    }

    $("restaurantName").textContent = t("loadingRestaurant");
    $("restaurantDescription").textContent = t("loading");
    $("menuContainer").innerHTML =
        '<div class="loading">' + escapeHTML(t("loadingMenu")) + '</div>';

    try {
        const request = db
            .from("food_restaurants")
            .select("*")
            .eq("id", restaurantId)
            .maybeSingle();

        const timeout = new Promise((_, reject) =>
            setTimeout(() => reject(new Error("REQUEST_TIMEOUT")), 15000)
        );

        const {data, error} = await Promise.race([request, timeout]);

        if (error) {
            console.error("Restaurant error:", error);
            $("restaurantName").textContent = t("failedRestaurant");
            $("restaurantDescription").textContent = "";
            showError($("menuContainer"), error.message, loadRestaurant);
            return;
        }

        if (!data) {
            $("restaurantName").textContent = t("restaurantNotFound");
            $("restaurantDescription").textContent = "";
            showError($("menuContainer"), t("restaurantDoesNotExist"));
            return;
        }

        restaurantData = data;
        renderRestaurant();
        await loadMenu();

    } catch (error) {
        console.error("Unable to load restaurant:", error);

        $("restaurantName").textContent = t("unableRestaurant");
        $("restaurantDescription").textContent = "";

        const message = error.message === "REQUEST_TIMEOUT"
            ? t("requestTimeout")
            : (error.message || t("unableRestaurant"));

        showError($("menuContainer"), message, loadRestaurant);
    }
}

/* LOAD MENU */
async function loadMenu() {
    $("menuContainer").innerHTML =
        '<div class="loading">' + escapeHTML(t("loadingMenu")) + '</div>';

    try {
        const request = db
            .from("food_menu")
            .select("*")
            .eq("restaurant_id", restaurantId)
            .eq("is_available", true)
            .order("created_at", {ascending:false});

        const timeout = new Promise((_, reject) =>
            setTimeout(() => reject(new Error("REQUEST_TIMEOUT")), 15000)
        );

        const {data, error} = await Promise.race([request, timeout]);

        if (error) {
            console.error("Menu error:", error);
            showError(
                $("menuContainer"),
                t("failedMenu") + " " + error.message,
                loadMenu
            );
            return;
        }

        menuData = data || [];

        if (!menuData.length) {
            $("menuContainer").innerHTML =
                '<div class="empty">' + escapeHTML(t("noFood")) + '</div>';
            return;
        }

        renderMenu();

    } catch (error) {
        console.error("Unable to load menu:", error);

        const message = error.message === "REQUEST_TIMEOUT"
            ? t("requestTimeout")
            : t("failedMenu") + " " + (error.message || "");

        showError($("menuContainer"), message, loadMenu);
    }
}

/* RENDER MENU */
function renderMenu() {
    const container = $("menuContainer");
    container.replaceChildren();

    const grid = document.createElement("div");
    grid.className = "menu-grid";

    menuData.forEach(food => {
        const card = document.createElement("article");
        card.className = "food-card";

        if (food.image_url) {
            const image = document.createElement("img");
            image.className = "food-image";
            image.src = food.image_url;
            image.alt = food.name || t("food");
            image.loading = "lazy";
            image.onerror = function() {
                const placeholder = document.createElement("div");
                placeholder.className = "food-placeholder";
                placeholder.textContent = t("food");
                this.replaceWith(placeholder);
            };
            card.appendChild(image);
        } else {
            const placeholder = document.createElement("div");
            placeholder.className = "food-placeholder";
            placeholder.textContent = t("food");
            card.appendChild(placeholder);
        }

        const info = document.createElement("div");
        info.className = "food-info";

        const name = document.createElement("div");
        name.className = "food-name";
        name.textContent = food.name || t("food");

        const description = document.createElement("div");
        description.className = "food-description";
        description.textContent = food.description || t("noDescription");

        const category = document.createElement("div");
        category.className = "food-category";
        category.textContent = t("category") + ": " + (food.category || t("other"));

        const price = document.createElement("div");
        price.className = "food-price";
        price.textContent = "TSh " + Number(food.price || 0).toLocaleString();

        const available = document.createElement("span");
        available.className = "availability available";
        available.textContent = t("available");

        const button = document.createElement("button");
        button.type = "button";
        button.className = "cart-button";
        button.textContent = t("addToCart");
        button.onclick = () => addToCart(food);

        info.append(name, description, category, price, available, button);
        card.appendChild(info);
        grid.appendChild(card);
    });

    container.appendChild(grid);
}

/* ADD TO CART - SAME foodCart STRUCTURE */
function addToCart(food) {
    if (!food.is_available) {
        showToast(t("unavailable"));
        return;
    }

    let cart = [];
    try {
        cart = JSON.parse(localStorage.getItem("foodCart") || "[]");
        if (!Array.isArray(cart)) cart = [];
    } catch {
        cart = [];
    }

    if (cart.length && cart.some(item =>
        String(item.restaurant_id) !== String(food.restaurant_id)
    )) {
        showToast(t("anotherRestaurant"));
        return;
    }

    const existing = cart.find(item =>
        String(item.menu_id) === String(food.id)
    );

    if (existing) {
        existing.quantity = Number(existing.quantity || 0) + 1;
    } else {
        cart.push({
            menu_id: food.id,
            restaurant_id: food.restaurant_id,
            food_name: food.name,
            price: Number(food.price || 0),
            quantity: 1,
            image_url: food.image_url || ""
        });
    }

    localStorage.setItem("foodCart", JSON.stringify(cart));
    updateCartCount();
    showToast((food.name || t("food")) + " " + t("added"));
}

/* CART COUNT */
function updateCartCount() {
    let cart = [];

    try {
        cart = JSON.parse(localStorage.getItem("foodCart") || "[]");
        if (!Array.isArray(cart)) cart = [];
    } catch {
        cart = [];
    }

    const count = cart.reduce(
        (total, item) => total + Math.max(0, Number(item.quantity || 0)),
        0
    );

    $("cartCount").textContent = count;
}

function goToCart() {
    window.location.href = "cart.html";
}

$("cartButton").addEventListener("keydown", event => {
    if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        goToCart();
    }
});

window.addEventListener("storage", event => {
    if (event.key === "foodLanguage") {
        currentLanguage = event.newValue === "sw" ? "sw" : "en";
        applyLanguage();
    }
    if (event.key === "foodCart") updateCartCount();
});

/* START */
applyLanguage();
updateCartCount();
loadRestaurant();
</script>

</body>
</html>
