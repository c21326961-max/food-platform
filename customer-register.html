        const registerForm = document.getElementById("registerForm");
        const registerBtn = document.getElementById("registerBtn");
        const errorMessage = document.getElementById("errorMessage");
        const successMessage = document.getElementById("successMessage");
        const passwordInput = document.getElementById("password");
        const showPasswordBtn = document.getElementById("showPassword");
        const languageSelect = document.getElementById("languageSelect");

        let language = localStorage.getItem("foodLanguage") || "en";

        function getSupabaseClient() {
            if (typeof db !== "undefined" && db && db.auth) {
                return db;
            }

            if (
                typeof supabaseClient !== "undefined" &&
                supabaseClient &&
                supabaseClient.auth
            ) {
                return supabaseClient;
            }

            return null;
        }

        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = "block";
            successMessage.style.display = "none";
        }

        function showSuccess(message) {
            successMessage.textContent = message;
            successMessage.style.display = "block";
            errorMessage.style.display = "none";
        }

        function clearMessages() {
            errorMessage.style.display = "none";
            successMessage.style.display = "none";
        }

        function updateLanguage() {
            const t = translations[language] || translations.en;

            document.documentElement.lang = language;

            document.getElementById("pageTitle").textContent = t.title;
            document.getElementById("introText").textContent = t.intro;

            document.getElementById("nameLabel").textContent = t.name;
            document.getElementById("fullName").placeholder = t.namePlaceholder;

            document.getElementById("phoneLabel").textContent = t.phone;
            document.getElementById("phone").placeholder = t.phonePlaceholder;

            document.getElementById("emailLabel").textContent = t.email;
            document.getElementById("email").placeholder = t.emailPlaceholder;

            document.getElementById("passwordLabel").textContent = t.password;
            passwordInput.placeholder = t.passwordPlaceholder;

            showPasswordBtn.textContent =
                passwordInput.type === "password" ? t.show : t.hide;

            document.getElementById("passwordHint").textContent = t.passwordHint;
            document.getElementById("loginText").textContent = t.loginText;
            document.getElementById("loginLink").textContent = t.loginLink;
            document.getElementById("homeLink").textContent = t.home;

            if (!registerBtn.disabled) {
                registerBtn.textContent = t.register;
            }

            languageSelect.value = language;
        }

        languageSelect.addEventListener("change", function() {
            language = this.value;
            localStorage.setItem("foodLanguage", language);
            updateLanguage();
            clearMessages();
        });

        showPasswordBtn.addEventListener("click", function() {
            passwordInput.type =
                passwordInput.type === "password" ? "text" : "password";

            updateLanguage();
        });

        registerForm.addEventListener("submit", async function(event) {
            event.preventDefault();
            clearMessages();

            const t = translations[language] || translations.en;

            const fullName = document.getElementById("fullName").value.trim();
            const phone = document.getElementById("phone").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = passwordInput.value;

            if (!fullName || !phone || !email || !password) {
                showError(t.required);
                return;
            }

            if (fullName.length < 2) {
                showError(t.invalidName);
                return;
            }

            if (!/^[+0-9()\s-]{7,25}$/.test(phone)) {
                showError(t.invalidPhone);
                return;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                showError(t.invalidEmail);
                return;
            }

            if (password.length < 6) {
                showError(t.shortPassword);
                return;
            }

            if (password.length > 72) {
                showError(t.longPassword);
                return;
            }

            const client = getSupabaseClient();

            if (!client) {
                showError(t.noClient);
                console.error("Supabase client not found. Check supabase.js.");
                return;
            }

            registerBtn.disabled = true;
            registerBtn.textContent = t.creating;

            try {
                const { data, error } = await client.auth.signUp({

                    password: password,
                    options: {
                        data: {
                            full_name: fullName,
                            phone: phone,
                            role: "customer"
                        }
                    }
                });

                if (error) {
                    throw error;
                }

                if (!data || !data.user) {
                    throw new Error("Account could not be created.");
                }

                registerForm.reset();

                if (!data.session) {
                    showSuccess(t.confirmEmail);
                    return;
                }

                showSuccess(t.success);

                // Preserve the existing workflow and database.
                window.location.assign("index.html");

            } catch (error) {
                console.error("Customer registration error:", error);

                const message = String(error?.message || "").toLowerCase();
                let friendlyMessage = t.failed;

                if (
                    message.includes("already registered") ||
                    message.includes("already been registered") ||
                    message.includes("user already exists")
                ) {
                    friendlyMessage = t.alreadyRegistered;
                } else if (
                    message.includes("password") &&
                    (
                        message.includes("weak") ||
                        message.includes("strength") ||
                        message.includes("easy to guess")
                    )
                ) {
                    friendlyMessage = t.weakPassword;
                } else if (
                    message.includes("rate limit") ||
                    message.includes("too many requests")
                ) {
                    friendlyMessage = t.rateLimit;
                } else if (
                    message.includes("failed to fetch") ||
                    message.includes("network") ||
                    message.includes("fetch")
                ) {
                    friendlyMessage = t.network;
                } else if (error?.message) {
                    // Preserve useful Supabase error details.
                    friendlyMessage = error.message;
                }

                showError(friendlyMessage);

            } finally {
                registerBtn.disabled = false;
                registerBtn.textContent = t.register;
            }
        });

        updateLanguage();
    </script>
