<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | Food Platform</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-box {
            max-width: 450px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .auth-box h1 {
            margin-bottom: 8px;
        }

        .auth-box > p {
            color: #777;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #ff6b35;
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #ff6b35;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-btn:disabled {
            opacity: 0.6;
        }

        .message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            display: none;
        }

        .error {
            background: #ffebee;
            color: #c62828;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #ff6b35;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="page-header">
        <h1>🍽️ Food Platform</h1>
    </div>

    <main class="container">

        <div class="auth-box">

            <h1>👤 Create Account</h1>

            <p>
                Create your customer account to order food.
            </p>

            <form id="registerForm">

                <div class="form-group">

                    <label for="fullName">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="register-btn"
                    id="registerBtn"
                >
                    📝 Create Account
                </button>

            </form>


            <div
                id="errorMessage"
                class="message error"
            ></div>


            <div
                id="successMessage"
                class="message success"
            ></div>


            <div class="login-link">

                Already have an account?

                <a href="customer-login.html">
                    Login
                </a>

            </div>

        </div>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <script>

        const registerForm =
            document.getElementById("registerForm");

        const registerBtn =
            document.getElementById("registerBtn");

        const errorMessage =
            document.getElementById("errorMessage");

        const successMessage =
            document.getElementById("successMessage");


        registerForm.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                errorMessage.style.display =
                    "none";

                successMessage.style.display =
                    "none";


                const fullName =
                    document
                        .getElementById("fullName")
                        .value
                        .trim();


                const phone =
                    document
                        .getElementById("phone")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                registerBtn.disabled = true;

                registerBtn.textContent =
                    "⏳ Creating account...";


                try {

                    const {
                        data,
                        error
                    } = await supabaseClient.auth.signUp({

                        email: email,

                        password: password,

                        options: {
                            data: {
                                full_name: fullName,
                                phone: phone,
                                role: "customer"
                            }
                        }

                    });


                    if (error) {

                        throw error;

                    }


                    successMessage.textContent =
                        "✅ Account created successfully!";

                    successMessage.style.display =
                        "block";


                    registerForm.reset();


                    setTimeout(function() {

                        window.location.href =
                            "customer-login.html";

                    }, 1200);


                } catch (error) {

                    console.error(error);


                    errorMessage.textContent =
                        "❌ " + (
                            error.message ||
                            "Registration failed."
                        );


                    errorMessage.style.display =
                        "block";


                } finally {

                    registerBtn.disabled = false;

                    registerBtn.textContent =
                        "📝 Create Account";

                }

            }
        );

    </script>

</body>
</html>
