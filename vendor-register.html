<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vendor Registration | Food Platform</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,.08);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 7px;
        }

        .subtitle {
            color: #777;
            font-size: 14px;
            margin-bottom: 22px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            height: 45px;
            border: 1px solid #ddd;
            border-radius: 7px;
            padding: 0 13px;
            font-size: 14px;
            margin-bottom: 16px;
            outline: none;
        }

        input:focus {
            border-color: #ff6b35;
        }

        button {
            width: 100%;
            height: 46px;
            border: none;
            border-radius: 7px;
            background: #ff6b35;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        button:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .message {
            display: none;
            margin-bottom: 15px;
            padding: 11px;
            border-radius: 7px;
            font-size: 14px;
        }

        .error {
            background: #ffe5e5;
            color: #b00020;
        }

        .success {
            background: #e7f7ed;
            color: #187a3d;
        }

        .login-link {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .login-link a {
            color: #ff6b35;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="card">

        <h1>Create Vendor Account</h1>

        <p class="subtitle">
            Create your vendor account first. You will complete your restaurant information on the next page.
        </p>

        <div id="message" class="message"></div>

        <form id="registerForm">

            <label>Full Name</label>
            <input
                type="text"
                id="fullName"
                placeholder="Enter your full name"
                required
            >

            <label>Phone Number</label>
            <input
                type="tel"
                id="phone"
                placeholder="Enter phone number"
                required
            >

            <label>Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter email"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create password"
                required
            >

            <label>Confirm Password</label>
            <input
                type="password"
                id="confirmPassword"
                placeholder="Confirm password"
                required
            >

            <button type="submit" id="registerBtn">
                Create Account
            </button>

        </form>

        <div class="login-link">
            Already have an account?
            <a href="vendor-login.html">Login</a>
        </div>

    </div>

</div>

<script>

const SUPABASE_URL = "https://ienquzigbawhvthnirtj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_tSbACTjOICJlthE03XmGCA_sIgigXup";

const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


const registerForm = document.getElementById("registerForm");
const registerBtn = document.getElementById("registerBtn");
const message = document.getElementById("message");


function showMessage(text, type = "error") {

    message.textContent = text;
    message.className = "message " + type;
    message.style.display = "block";

}


registerForm.addEventListener("submit", async function(e) {

    e.preventDefault();

    const fullName =
        document.getElementById("fullName").value.trim();

    const phone =
        document.getElementById("phone").value.trim();

    const email =
        document.getElementById("email").value.trim();

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirmPassword").value;


    if (password !== confirmPassword) {

        showMessage("Passwords do not match.");

        return;
    }


    if (password.length < 6) {

        showMessage("Password must be at least 6 characters.");

        return;
    }


    registerBtn.disabled = true;
    registerBtn.textContent = "Creating Account...";


    try {

        /*
         * STEP 1
         * Create Supabase Auth account
         */

        const {
            data,
            error
        } = await db.auth.signUp({

            email: email,

            password: password,

            options: {
                data: {
                    full_name: fullName,
                    phone: phone
                }
            }

        });


        if (error) {
            throw error;
        }


        if (!data.user) {
            throw new Error("Account could not be created.");
        }


        /*
         * STEP 2
         * Create vendor record
         */

        const {
            error: vendorError
        } = await db
            .from("food_vendors")
            .insert({

                id: data.user.id,

                full_name: fullName,

                phone: phone,

                email: email

            });


        if (vendorError) {
            throw vendorError;
        }


        /*
         * STEP 3
         * Send vendor to profile/setup page
         */

        showMessage(
            "Account created. Opening your vendor setup...",
            "success"
        );


        setTimeout(() => {

            window.location.href = "vendor-profile.html";

        }, 700);


    } catch (error) {

        console.error(error);

        showMessage(
            error.message || "Registration failed."
        );

        registerBtn.disabled = false;
        registerBtn.textContent = "Create Account";

    }

});

</script>

</body>
</html>
