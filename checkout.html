
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Food Platform</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <script src="./language.js" defer></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .checkout-container {
            max-width: 700px;
            margin: auto;
            padding: 18px;
            padding-bottom: 40px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 12px;
            text-decoration: none;
            color: #f97316;
            font-weight: bold;
        }

        .page-title {
            margin: 5px 0 18px;
            font-size: 27px;
        }

        .checkout-card {
            background: white;
            padding: 18px;
            border-radius: 14px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,.06);
        }

        .checkout-card h2 {
            margin: 0 0 14px;
            font-size: 19px;
        }

        label {
            display: block;
            margin-top: 13px;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5dbe5;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            background: white;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            border-color: #f97316;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .delivery-option {
            display: flex;
            flex-wrap: wrap;
            gap: 25px;
            margin: 10px 0;
        }

        .delivery-option label {
            display: flex;
            align-items: center;
            gap: 7px;
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        .delivery-option input { width: auto; }

        .location-help {
            background: #fff7ed;
            border-left: 3px solid #f97316;
            padding: 10px;
            border-radius: 7px;
            margin-top: 8px;
            font-size: 13px;
            line-height: 1.5;
            color: #555;
        }

        .restaurant-name {
            padding: 12px;
            background: #fff7ed;
            border-radius: 9px;
            font-weight: bold;
            margin-bottom: 14px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            padding: 11px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .order-item-name { flex: 1; }
        .order-item-qty { color: #777; white-space: nowrap; }
        .order-item-price { font-weight: bold; white-space: nowrap; }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin: 12px 0;
            font-size: 14px;
        }

        .total {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            border-top: 1px solid #ddd;
            padding-top: 15px;
            margin-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        .total strong:last-child { color: #f97316; }

        #placeOrderBtn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #f97316;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 18px;
        }

        #placeOrderBtn:hover { background: #ea580c; }

        #placeOrderBtn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 12px;
            padding: 12px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .success { background: #dcfce7; color: #166534; }
        .error { background: #fee2e2; color: #991b1b; }
        .hidden { display: none !important; }
        .loading { color: #777; font-size: 14px; padding: 8px 0; }
    </style>
</head>

<body>
<div class="checkout-container">

    <a href="cart.html" class="back-link">← Back to Cart</a>
    <h1 class="page-title">Checkout</h1>

    <div class="checkout-card">
        <h2>Customer Information</h2>

        <label for="customerName">Full Name</label>
        <input type="text" id="customerName" autocomplete="name"
               placeholder="Enter your full name" required>

        <label for="customerPhone">Phone Number</label>
        <input type="tel" id="customerPhone" autocomplete="tel"
               placeholder="Enter your phone number" required>
    </div>

    <div class="checkout-card">
        <h2>Delivery Method</h2>

        <div class="delivery-option">
            <label>
                <input type="radio" name="deliveryType" value="delivery" checked>
                Delivery
            </label>
            <label>
                <input type="radio" name="deliveryType" value="pickup">
                Pickup
            </label>
        </div>

        <div id="locationSection">
            <label for="deliveryLocation">Delivery Location</label>
            <textarea id="deliveryLocation"
                      placeholder="Mfano: Keko, karibu na..."></textarea>
            <div class="location-help">
                Taja eneo, mtaa, barabara au alama ya eneo iliyo karibu
                ili dereva aweze kukupata kwa urahisi.
            </div>
        </div>

        <label for="instructions">Additional Instructions</label>
        <textarea id="instructions"
                  placeholder="Mfano: Nipigie simu ukifika..."></textarea>
    </div>

    <div class="checkout-card">
        <h2>Order Summary</h2>

        <div id="restaurantName" class="restaurant-name">
            Loading restaurant...
        </div>

        <div id="orderItems">
            <div class="loading">Loading items...</div>
        </div>

        <div class="summary-row">
            <span>Subtotal</span>
            <strong id="subtotal">TSh 0</strong>
        </div>

        <div class="summary-row">
            <span>Delivery Fee</span>
            <strong id="deliveryFee">TSh 0</strong>
        </div>

        <div class="total">
            <span>Total</span>
            <strong id="total">TSh 0</strong>
        </div>

        <button id="placeOrderBtn" type="button" disabled>
            Place Order
        </button>

        <div id="message" role="alert" aria-live="polite"></div>
    </div>
</div>

<script>
"use strict";

/* ==========================================
   SUPABASE CLIENT
========================================== */

const db = window.db;

let cart = [];
let restaurant = null;
let currentUser = null;
let isSubmitting = false;

const customerName = document.getElementById("customerName");
const customerPhone = document.getElementById("customerPhone");
const deliveryLocation = document.getElementById("deliveryLocation");
const instructions = document.getElementById("instructions");
const locationSection = document.getElementById("locationSection");
const restaurantNameElement = document.getElementById("restaurantName");
const orderItemsElement = document.getElementById("orderItems");
const subtotalElement = document.getElementById("subtotal");
const deliveryFeeElement = document.getElementById("deliveryFee");
const totalElement = document.getElementById("total");
const placeOrderBtn = document.getElementById("placeOrderBtn");
const messageElement = document.getElementById("message");

function money(value) {
    return "TSh " + Number(value || 0).toLocaleString("en-TZ", {
        maximumFractionDigits: 2
    });
}

function showMessage(text, type) {
    messageElement.textContent = text;
    messageElement.className = type;
    messageElement.style.display = "block";
}

function hideMessage() {
    messageElement.style.display = "none";
    messageElement.textContent = "";
}

function resetButton() {
    isSubmitting = false;
    placeOrderBtn.disabled = false;
    placeOrderBtn.textContent = "Place Order";
}

function escapeHTML(value) {
    return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}

function getDeliveryType() {
    const selected = document.querySelector(
        'input[name="deliveryType"]:checked'
    );
    return selected ? selected.value : "delivery";
}

/* ==========================================
   LOAD CHECKOUT
========================================== */

async function loadCheckout() {
    placeOrderBtn.disabled = true;

    try {
        if (!db || !db.auth) {
            throw new Error(
                "Supabase haijaunganishwa. Kagua supabase.js na mpangilio wa script."
            );
        }

        const { data: { user }, error: userError } =
            await db.auth.getUser();

        if (userError) throw userError;

        if (!user) {
            alert("Please login as a customer first.");
            window.location.href = "customer-login.html";
            return;
        }

        currentUser = user;

        let savedCart;
        try {
            savedCart = JSON.parse(
                localStorage.getItem("foodCart") || "[]"
            );
        } catch {
            savedCart = [];
        }

        if (!Array.isArray(savedCart) || savedCart.length === 0) {
            alert("Your cart is empty.");
            window.location.href = "cart.html";
            return;
        }

        cart = savedCart.map(item => ({
            menu_id: item.menu_id || item.id || null,
            restaurant_id: item.restaurant_id || null,
            food_name: item.food_name || item.name || "",
            price: Number(item.price),
            quantity: Number(item.quantity ?? 1),
            image_url: item.image_url || ""
        }));

        const restaurantIds = [
            ...new Set(cart.map(item => item.restaurant_id).filter(Boolean))
        ];

        if (restaurantIds.length !== 1) {
            throw new Error(
                "Cart lazima iwe na bidhaa kutoka restaurant moja tu. Rudi cart na uhakikishe bidhaa zote zina restaurant_id sahihi."
            );
        }

        const { data: restaurantData, error: restaurantError } =
            await db
                .from("food_restaurants")
                .select("*")
                .eq("id", restaurantIds[0])
                .maybeSingle();

        if (restaurantError) throw restaurantError;

        if (!restaurantData) {
            throw new Error("Restaurant haijapatikana.");
        }

        restaurant = restaurantData;
        restaurantNameElement.textContent =
            restaurant.name || "Restaurant";

        const metadata = currentUser.user_metadata || {};
        customerName.value =
            metadata.full_name || metadata.name || "";
        customerPhone.value = metadata.phone || "";

        renderOrderItems();
        calculateTotal();

        placeOrderBtn.disabled = false;

    } catch (error) {
        console.error("Checkout loading error:", error);

        restaurantNameElement.textContent = "Unable to load restaurant";
        orderItemsElement.textContent =
            "Imeshindwa kupakia oda. Tafadhali kagua cart yako na ujaribu tena.";

        showMessage(
            "Checkout error: " + (error.message || "Unknown error"),
            "error"
        );

        placeOrderBtn.disabled = true;
    }
}

/* ==========================================
   RENDER ITEMS
========================================== */

function renderOrderItems() {
    orderItemsElement.replaceChildren();

    cart.forEach(item => {
        const row = document.createElement("div");
        row.className = "order-item";

        const name = document.createElement("div");
        name.className = "order-item-name";
        name.textContent = item.food_name;

        const quantity = document.createElement("div");
        quantity.className = "order-item-qty";
        quantity.textContent = "x" + item.quantity;

        const price = document.createElement("div");
        price.className = "order-item-price";
        price.textContent = money(item.price * item.quantity);

        row.append(name, quantity, price);
        orderItemsElement.appendChild(row);
    });
}

/* ==========================================
   TOTALS
========================================== */

function calculateTotal() {
    const subtotal = cart.reduce(
        (sum, item) => sum + Number(item.price) * Number(item.quantity),
        0
    );

    const deliveryFee =
        getDeliveryType() === "delivery" && restaurant
            ? Number(restaurant.delivery_fee || 0)
            : 0;

    subtotalElement.textContent = money(subtotal);
    deliveryFeeElement.textContent = money(deliveryFee);
    totalElement.textContent = money(subtotal + deliveryFee);

    return { subtotal, deliveryFee, total: subtotal + deliveryFee };
}

document.querySelectorAll('input[name="deliveryType"]').forEach(radio => {
    radio.addEventListener("change", () => {
        if (getDeliveryType() === "delivery") {
            locationSection.classList.remove("hidden");
        } else {
            locationSection.classList.add("hidden");
        }
        calculateTotal();
    });
});

/* ==========================================
   PLACE ORDER
========================================== */

placeOrderBtn.addEventListener("click", async () => {
    if (isSubmitting) return;

    isSubmitting = true;
    placeOrderBtn.disabled = true;
    placeOrderBtn.textContent = "Processing...";
    hideMessage();

    let orderId = null;
    let orderWasCreated = false;

    try {
        if (!db || !currentUser || !restaurant) {
            throw new Error(
                "Taarifa za checkout hazijakamilika. Refresh ukurasa ujaribu tena."
            );
        }

        const name = customerName.value.trim();
        const phone = customerPhone.value.trim();
        const location = deliveryLocation.value.trim();
        const notes = instructions.value.trim();
        const deliveryType = getDeliveryType();

        if (!name) throw new Error("Tafadhali weka jina lako kamili.");
        if (!phone) throw new Error("Tafadhali weka namba ya simu.");

        if (deliveryType === "delivery" && !location) {
            throw new Error("Tafadhali weka eneo la kupeleka oda.");
        }

        if (!Array.isArray(cart) || cart.length === 0) {
            throw new Error("Cart yako haina bidhaa.");
        }

        for (const item of cart) {
            if (
                !item.menu_id ||
                !item.food_name ||
                !Number.isFinite(item.price) ||
                item.price < 0 ||
                !Number.isInteger(item.quantity) ||
                item.quantity < 1
            ) {
                throw new Error(
                    "Taarifa za bidhaa si sahihi. Rudi cart na uhakikishe bidhaa na idadi yake."
                );
            }

            if (item.restaurant_id !== restaurant.id) {
                throw new Error(
                    "Bidhaa moja au zaidi hazilingani na restaurant iliyochaguliwa."
                );
            }
        }

        const totals = calculateTotal();

        if (!Number.isFinite(totals.total) || totals.total < 0) {
            throw new Error("Jumla ya malipo si sahihi.");
        }

        const orderNumber = "ORD-" + Date.now();

        const orderData = {
            order_number: orderNumber,
            customer_id: currentUser.id,
            customer_name: name,
            customer_phone: phone,
            delivery_location:
                deliveryType === "pickup" ? "Pickup" : location,
            latitude: null,
            longitude: null,
            instructions: notes || null,
            delivery_type: deliveryType,
            subtotal: totals.subtotal,
            delivery_fee: totals.deliveryFee,
            total: totals.total,
            restaurant_id: restaurant.id,
            status: "Pending"
        };

        const { data: order, error: orderError } = await db
            .from("food_orders")
            .insert(orderData)
            .select()
            .single();

        if (orderError) throw orderError;

        if (!order || !order.id) {
            throw new Error("Supabase haikurudisha ID ya oda.");
        }

        orderId = order.id;
        orderWasCreated = true;

        /*
         * MUHIMU:
         * item_total ni GENERATED ALWAYS AS (price * quantity).
         * Usiitumie kwenye insert. Supabase itaihesabu yenyewe.
         */
        const orderItems = cart.map(item => ({
            order_id: order.id,
            menu_id: item.menu_id,
            food_name: item.food_name,
            price: item.price,
            quantity: item.quantity
        }));

        const { error: itemsError } = await db
            .from("food_order_items")
            .insert(orderItems);

        if (itemsError) {
            console.error("Order items insert error:", itemsError);

            throw new Error(
                "Oda namba " + orderNumber +
                " imeundwa, lakini kuhifadhi bidhaa zake kumeshindwa. " +
                "Usibonyeze Place Order tena kwa sasa. Kosa: " +
                itemsError.message
            );
        }

        const completeOrder = {
            ...order,
            items: cart.map(item => ({
                menu_id: item.menu_id,
                food_name: item.food_name,
                price: item.price,
                quantity: item.quantity,
                image_url: item.image_url
            })),
            restaurant_name: restaurant.name
        };

        localStorage.setItem("lastOrder", JSON.stringify(completeOrder));
        localStorage.setItem("lastOrderNumber", orderNumber);
        localStorage.setItem("lastOrderId", order.id);
        localStorage.removeItem("foodCart");

        window.location.href = "order-confirmation.html";

    } catch (error) {
        console.error("Place order error:", error);

        showMessage(
            (orderWasCreated
                ? "TAHADHARI: Oda ID " + orderId + ". "
                : "Failed to place order: ") +
            (error.message || "Unknown error"),
            "error"
        );

        resetButton();
    }
});

/* ==========================================
   START
========================================== */

loadCheckout();
</script>
</body>
</html>
