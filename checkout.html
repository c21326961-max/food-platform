<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | Food Platform</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .checkout-container {
            max-width: 700px;
            margin: auto;
            padding: 15px;
            padding-bottom: 40px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 12px;
            text-decoration: none;
            color: #f97316;
            font-weight: bold;
        }

        .page-title {
            margin: 5px 0 15px;
            font-size: 25px;
        }

        .checkout-card {
            background: white;
            padding: 16px;
            border-radius: 14px;
            margin-bottom: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
        }

        .checkout-card h2 {
            margin: 0 0 14px;
            font-size: 19px;
        }

        label {
            display: block;
            margin-top: 13px;
            margin-bottom: 6px;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="text"],
        input[type="tel"],
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d5d5d5;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            background: white;
        }

        input[type="text"]:focus,
        input[type="tel"]:focus,
        textarea:focus {
            border-color: #f97316;
        }

        textarea {
            min-height: 90px;
            resize: vertical;
        }

        .delivery-option {
            display: flex;
            gap: 25px;
            margin-top: 5px;
        }

        .delivery-option label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        .delivery-option input {
            width: auto;
        }

        .location-help {
            background: #fff7ed;
            border-left: 3px solid #f97316;
            padding: 10px;
            border-radius: 7px;
            margin-top: 8px;
            font-size: 13px;
            line-height: 1.4;
            color: #555;
        }

        .restaurant-name {
            padding: 11px 12px;
            background: #f8f8f8;
            border-radius: 9px;
            font-weight: bold;
            margin-bottom: 14px;
        }

        .order-items {
            margin-bottom: 15px;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .order-item-name {
            flex: 1;
        }

        .order-item-qty {
            color: #777;
        }

        .order-item-price {
            font-weight: bold;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 14px;
        }

        .total {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #ddd;
            padding-top: 14px;
            margin-top: 14px;
            font-size: 20px;
            font-weight: bold;
        }

        .total strong:last-child {
            color: #f97316;
        }

        #placeOrderBtn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #f97316;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 17px;
        }

        #placeOrderBtn:hover {
            background: #ea580c;
        }

        #placeOrderBtn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 12px;
            padding: 11px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
        }

        .hidden {
            display: none !important;
        }

        .loading {
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="checkout-container">

    <a href="cart.html" class="back-link">
        ← Back to Cart
    </a>

    <h1 class="page-title">
        Checkout
    </h1>

    <!-- CUSTOMER INFORMATION -->

    <div class="checkout-card">

        <h2>Customer Information</h2>

        <label for="customerName">
            Full Name
        </label>

        <input
            type="text"
            id="customerName"
            placeholder="Enter your full name"
        >

        <label for="customerPhone">
            Phone Number
        </label>

        <input
            type="tel"
            id="customerPhone"
            placeholder="Enter your phone number"
        >

    </div>


    <!-- DELIVERY METHOD -->

    <div class="checkout-card">

        <h2>Delivery Method</h2>

        <div class="delivery-option">

            <label>
                <input
                    type="radio"
                    name="deliveryType"
                    value="delivery"
                    checked
                >
                Delivery
            </label>

            <label>
                <input
                    type="radio"
                    name="deliveryType"
                    value="pickup"
                >
                Pickup
            </label>

        </div>


        <div id="locationSection">

            <label for="deliveryLocation">
                Delivery Location
            </label>

            <textarea
                id="deliveryLocation"
                placeholder="Mfano: Keko, karibu na..."
            ></textarea>

            <div class="location-help">
                Taja eneo, mtaa, barabara au landmark
                iliyo karibu ili eneo lako lijulikane kwa usahihi.
            </div>

        </div>


        <label for="instructions">
            Additional Instructions
        </label>

        <textarea
            id="instructions"
            placeholder="Mfano: Nipigie simu ukifika..."
        ></textarea>

    </div>


    <!-- ORDER SUMMARY -->

    <div class="checkout-card">

        <h2>Order Summary</h2>

        <div
            id="restaurantName"
            class="restaurant-name"
        >
            Loading restaurant...
        </div>


        <div
            id="orderItems"
            class="order-items"
        >
            <div class="loading">
                Loading items...
            </div>
        </div>


        <div class="summary-row">

            <span>
                Subtotal
            </span>

            <strong id="subtotal">
                TSh 0
            </strong>

        </div>


        <div class="summary-row">

            <span>
                Delivery Fee
            </span>

            <strong id="deliveryFee">
                TSh 0
            </strong>

        </div>


        <div class="total">

            <span>
                Total
            </span>

            <strong id="total">
                TSh 0
            </strong>

        </div>


        <button id="placeOrderBtn">
            Place Order
        </button>


        <div id="message"></div>

    </div>

</div>


<script>

/* ==========================================
   SUPABASE
========================================== */

const SUPABASE_URL =
    "https://ienquzigbawhvthnirtj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_tSbACTjOICJlthE03XmGCA_sIgigXup";

const db =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* ==========================================
   VARIABLES
========================================== */

let cart = [];
let restaurant = null;
let currentUser = null;


/* ==========================================
   ELEMENTS
========================================== */

const customerName =
    document.getElementById("customerName");

const customerPhone =
    document.getElementById("customerPhone");

const deliveryLocation =
    document.getElementById("deliveryLocation");

const instructions =
    document.getElementById("instructions");

const locationSection =
    document.getElementById("locationSection");

const restaurantNameElement =
    document.getElementById("restaurantName");

const orderItemsElement =
    document.getElementById("orderItems");

const subtotalElement =
    document.getElementById("subtotal");

const deliveryFeeElement =
    document.getElementById("deliveryFee");

const totalElement =
    document.getElementById("total");

const placeOrderBtn =
    document.getElementById("placeOrderBtn");

const messageElement =
    document.getElementById("message");


/* ==========================================
   MONEY
========================================== */

function money(value) {

    return "TSh " +
        Number(value || 0).toLocaleString();

}


/* ==========================================
   MESSAGE
========================================== */

function showMessage(
    text,
    type
) {

    messageElement.textContent = text;

    messageElement.className = type;

    messageElement.style.display =
        "block";

}


/* ==========================================
   LOAD CHECKOUT
========================================== */

async function loadCheckout() {

    try {

        /* ----------------------------------
           USER
        ---------------------------------- */

        const {
            data: {
                user
            },
            error: userError
        } =
            await db.auth.getUser();


        if (userError) {

            console.error(
                "User error:",
                userError
            );

        }


        if (!user) {

            alert(
                "Please login as a customer first."
            );

            window.location.href =
                "customer-login.html";

            return;

        }


        currentUser = user;


        /* ----------------------------------
           LOAD CART
        ---------------------------------- */

        let savedCart =
            localStorage.getItem(
                "foodCart"
            );


        try {

            cart =
                savedCart
                    ? JSON.parse(savedCart)
                    : [];

        } catch {

            cart = [];

        }


        if (
            !Array.isArray(cart) ||
            cart.length === 0
        ) {

            alert(
                "Your cart is empty."
            );

            window.location.href =
                "cart.html";

            return;

        }


        /* ----------------------------------
           NORMALIZE CART
        ---------------------------------- */

        cart = cart.map(item => ({

            menu_id:
                item.menu_id ||
                item.id ||
                null,

            restaurant_id:
                item.restaurant_id ||
                null,

            food_name:
                item.food_name ||
                item.name ||
                "Food Item",

            price:
                Number(item.price || 0),

            quantity:
                Number(item.quantity || 1),

            image_url:
                item.image_url ||
                ""

        }));


        /* ----------------------------------
           FIND RESTAURANT
        ---------------------------------- */

        const restaurantIds =
            [
                ...new Set(
                    cart
                        .map(
                            item =>
                                item.restaurant_id
                        )
                        .filter(Boolean)
                )
            ];


        if (
            restaurantIds.length !== 1
        ) {

            alert(
                "Please order from one restaurant at a time."
            );

            window.location.href =
                "cart.html";

            return;

        }


        const restaurantId =
            restaurantIds[0];


        /* ----------------------------------
           GET RESTAURANT
        ---------------------------------- */

        const {
            data,
            error
        } =
            await db
                .from(
                    "food_restaurants"
                )
                .select("*")
                .eq(
                    "id",
                    restaurantId
                )
                .maybeSingle();


        if (error) {

            console.error(
                "Restaurant error:",
                error
            );

            throw error;

        }


        if (!data) {

            alert(
                "Restaurant not found."
            );

            window.location.href =
                "cart.html";

            return;

        }


        restaurant = data;


        /* ----------------------------------
           RESTAURANT NAME
        ---------------------------------- */

        restaurantNameElement.textContent =
            restaurant.name ||
            "Restaurant";


        /* ----------------------------------
           CUSTOMER DATA
        ---------------------------------- */

        const metadata =
            currentUser.user_metadata ||
            {};


        customerName.value =
            metadata.full_name ||
            metadata.name ||
            "";


        customerPhone.value =
            metadata.phone ||
            "";


        /* ----------------------------------
           RENDER ITEMS
        ---------------------------------- */

        renderOrderItems();


        /* ----------------------------------
           CALCULATE
        ---------------------------------- */

        calculateTotal();


    } catch (error) {

        console.error(
            "Checkout loading error:",
            error
        );


        restaurantNameElement.textContent =
            "Unable to load restaurant";

        orderItemsElement.innerHTML = `
            <div class="error">
                Failed to load your order.
                Please return to cart and try again.
            </div>
        `;

    }

}


/* ==========================================
   RENDER ORDER ITEMS
========================================== */

function renderOrderItems() {

    orderItemsElement.innerHTML = "";


    cart.forEach(item => {

        const itemTotal =
            Number(item.price) *
            Number(item.quantity);


        const row =
            document.createElement("div");


        row.className =
            "order-item";


        row.innerHTML = `

            <div class="order-item-name">
                ${escapeHTML(
                    item.food_name
                )}
            </div>

            <div class="order-item-qty">
                x${item.quantity}
            </div>

            <div class="order-item-price">
                ${money(itemTotal)}
            </div>

        `;


        orderItemsElement.appendChild(
            row
        );

    });

}


/* ==========================================
   CALCULATE TOTAL
========================================== */

function calculateTotal() {

    let subtotal = 0;


    cart.forEach(item => {

        subtotal +=
            Number(item.price) *
            Number(item.quantity);

    });


    const selected =
        document.querySelector(
            'input[name="deliveryType"]:checked'
        );


    const deliveryType =
        selected
            ? selected.value
            : "delivery";


    let deliveryFee = 0;


    if (
        deliveryType === "delivery" &&
        restaurant
    ) {

        deliveryFee =
            Number(
                restaurant.delivery_fee ||
                0
            );

    }


    const total =
        subtotal +
        deliveryFee;


    subtotalElement.textContent =
        money(subtotal);


    deliveryFeeElement.textContent =
        money(deliveryFee);


    totalElement.textContent =
        money(total);

}


/* ==========================================
   DELIVERY CHANGE
========================================== */

document
    .querySelectorAll(
        'input[name="deliveryType"]'
    )
    .forEach(radio => {

        radio.addEventListener(
            "change",
            function() {

                if (
                    this.value === "delivery"
                ) {

                    locationSection
                        .classList
                        .remove("hidden");

                } else {

                    locationSection
                        .classList
                        .add("hidden");

                }


                calculateTotal();

            }
        );

    });


/* ==========================================
   PLACE ORDER
========================================== */

placeOrderBtn.addEventListener(
    "click",
    async function() {

        try {

            placeOrderBtn.disabled =
                true;

            placeOrderBtn.textContent =
                "Processing...";


            /* ------------------------------
               CUSTOMER
            ------------------------------ */

            const name =
                customerName.value.trim();

            const phone =
                customerPhone.value.trim();

            const location =
                deliveryLocation.value.trim();

            const notes =
                instructions.value.trim();


            const selected =
                document.querySelector(
                    'input[name="deliveryType"]:checked'
                );


            const deliveryType =
                selected
                    ? selected.value
                    : "delivery";


            /* ------------------------------
               VALIDATION
            ------------------------------ */

            if (!name) {

                showMessage(
                    "Please enter your full name.",
                    "error"
                );

                resetButton();

                return;

            }


            if (!phone) {

                showMessage(
                    "Please enter your phone number.",
                    "error"
                );

                resetButton();

                return;

            }


            if (
                deliveryType === "delivery" &&
                !location
            ) {

                showMessage(
                    "Please enter your delivery location.",
                    "error"
                );

                resetButton();

                return;

            }


            if (
                !restaurant ||
                !currentUser
            ) {

                showMessage(
                    "Checkout information is incomplete. Please reload the cart.",
                    "error"
                );

                resetButton();

                return;

            }


            /* ------------------------------
               CALCULATE
            ------------------------------ */

            let subtotal = 0;


            cart.forEach(item => {

                subtotal +=
                    Number(item.price) *
                    Number(item.quantity);

            });


            const deliveryFee =
                deliveryType === "delivery"
                    ? Number(
                        restaurant.delivery_fee ||
                        0
                    )
                    : 0;


            const total =
                subtotal +
                deliveryFee;


            /* ------------------------------
               ORDER NUMBER
            ------------------------------ */

            const orderNumber =
                "ORD-" +
                Date.now();


            /* ------------------------------
               ORDER DATA
            ------------------------------ */

            const orderData = {

                order_number:
                    orderNumber,

                customer_id:
                    currentUser.id,

                customer_name:
                    name,

                customer_phone:
                    phone,

                delivery_location:
                    deliveryType === "pickup"
                        ? "Pickup"
                        : location,

                latitude:
                    null,

                longitude:
                    null,

                instructions:
                    notes,

                delivery_type:
                    deliveryType,

                subtotal:
                    subtotal,

                delivery_fee:
                    deliveryFee,

                total:
                    total,

                restaurant_id:
                    restaurant.id,

                status:
                    "Pending"

            };


            /* ------------------------------
               INSERT ORDER
            ------------------------------ */

            const {
                data: order,
                error: orderError
            } =
                await db
                    .from(
                        "food_orders"
                    )
                    .insert(
                        orderData
                    )
                    .select()
                    .single();


            if (orderError) {

                throw orderError;

            }


            /* ------------------------------
               ORDER ITEMS
            ------------------------------ */

            const orderItems =
                cart.map(item => ({

                    order_id:
                        order.id,

                    menu_id:
                        item.menu_id,

                    food_name:
                        item.food_name,

                    price:
                        Number(item.price),

                    quantity:
                        Number(item.quantity)

                }));


            const {
                error: itemsError
            } =
                await db
                    .from(
                        "food_order_items"
                    )
                    .insert(
                        orderItems
                    );


            if (itemsError) {

                throw itemsError;

            }


            /* ------------------------------
               SAVE LAST ORDER
            ------------------------------ */

            const completeOrder = {

                ...order,

                items: cart.map(item => ({

                    menu_id:
                        item.menu_id,

                    food_name:
                        item.food_name,

                    price:
                        Number(item.price),

                    quantity:
                        Number(item.quantity),

                    image_url:
                        item.image_url ||
                        ""

                })),

                restaurant_name:
                    restaurant.name

            };


            localStorage.setItem(
                "lastOrder",
                JSON.stringify(
                    completeOrder
                )
            );


            localStorage.setItem(
                "lastOrderNumber",
                orderNumber
            );


            localStorage.setItem(
                "lastOrderId",
                order.id
            );


            /* ------------------------------
               CLEAR CART
            ------------------------------ */

            localStorage.removeItem(
                "foodCart"
            );


            /* ------------------------------
               SUCCESS
            ------------------------------ */

            window.location.href =
                "order-confirmation.html";


        } catch (error) {

            console.error(
                "Place order error:",
                error
            );


            showMessage(
                "Failed to place order: " +
                (
                    error.message ||
                    "Unknown error"
                ),
                "error"
            );


            resetButton();

        }

    }
);


/* ==========================================
   RESET BUTTON
========================================== */

function resetButton() {

    placeOrderBtn.disabled =
        false;

    placeOrderBtn.textContent =
        "Place Order";

}


/* ==========================================
   ESCAPE HTML
========================================== */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll(
            "'",
            "&#039;"
        );

}


/* ==========================================
   START
========================================== */

loadCheckout();

</script>

</body>
</html>
