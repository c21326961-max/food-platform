
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f97316">

    <title>My Orders | Food Platform</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>

    <style>
        * { box-sizing: border-box; }

        :root {
            --orange: #f97316;
            --orange-dark: #ea580c;
            --background: #f5f6f8;
            --text: #222;
            --muted: #6b7280;
            --border: #e5e7eb;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--background);
            color: var(--text);
        }

        button, select { font: inherit; }

        header {
            background: var(--orange);
            color: white;
            padding: 14px 16px;
        }

        .header-inner {
            max-width: 900px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        header h1 {
            margin: 0;
            font-size: 20px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .language-select {
            padding: 8px;
            border: 0;
            border-radius: 7px;
            background: white;
            color: #222;
            max-width: 115px;
        }

        .home-btn {
            background: white;
            color: var(--orange-dark);
            border: 0;
            border-radius: 7px;
            padding: 9px 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 16px;
            padding-bottom: 85px;
        }

        .page-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 5px 0 16px;
        }

        .page-title {
            margin: 0;
            font-size: 23px;
        }

        .order-count {
            color: var(--muted);
            font-size: 13px;
        }

        .order-card {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 14px;
            box-shadow: 0 2px 7px rgba(0,0,0,.025);
        }

        .order-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 12px;
        }

        .order-number {
            font-weight: bold;
            font-size: 15px;
            overflow-wrap: anywhere;
        }

        .restaurant {
            color: var(--muted);
            font-size: 13px;
            margin-top: 5px;
        }

        .order-date {
            color: var(--muted);
            font-size: 12px;
            margin-top: 5px;
        }

        .status {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            white-space: nowrap;
        }

        .pending {
            background: #fff7ed;
            color: #c2410c;
        }

        .confirmed {
            background: #eff6ff;
            color: #2563eb;
        }

        .preparing {
            background: #fefce8;
            color: #a16207;
        }

        .ready {
            background: #f0fdf4;
            color: #15803d;
        }

        .cancelled {
            background: #fef2f2;
            color: #dc2626;
        }

        .order-info {
            border-top: 1px solid #eee;
            border-bottom: 1px solid #eee;
            padding: 10px 0;
            margin: 10px 0;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin: 8px 0;
            font-size: 13px;
        }

        .info-label {
            color: var(--muted);
            flex-shrink: 0;
        }

        .info-value {
            text-align: right;
            overflow-wrap: anywhere;
        }

        .total {
            font-size: 16px;
            font-weight: bold;
            color: var(--orange-dark);
        }

        .actions {
            display: flex;
            gap: 9px;
            margin-top: 13px;
        }

        .btn {
            border: 0;
            border-radius: 8px;
            padding: 11px 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            flex: 1;
            min-width: 0;
        }

        .btn-primary {
            background: var(--orange);
            color: white;
        }

        .btn-primary:hover {
            background: var(--orange-dark);
        }

        .btn-secondary {
            background: #f3f4f6;
            color: #111827;
            border: 1px solid var(--border);
        }

        .btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .empty, .loading, .error-box {
            background: white;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px 20px;
            text-align: center;
            color: var(--muted);
        }

        .empty h3 {
            color: #222;
            margin-top: 0;
        }

        .empty p {
            line-height: 1.6;
        }

        .message {
            margin-top: 10px;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .message.error { color: #b91c1c; }
        .message.success { color: #15803d; }
        .message.info { color: #9a3412; }

        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            min-height: 58px;
            padding-bottom: env(safe-area-inset-bottom, 0px);
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            z-index: 100;
        }

        .bottom-nav a {
            flex: 1;
            min-height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #555;
            font-size: 12px;
            font-weight: bold;
        }

        .bottom-nav a.active {
            color: var(--orange);
        }

        .refresh-btn {
            border: 1px solid var(--border);
            background: white;
            padding: 9px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: #444;
        }

        @media (max-width: 500px) {
            .container {
                padding: 12px;
                padding-bottom: 85px;
            }

            header h1 { font-size: 17px; }

            .header-inner { gap: 7px; }

            .header-actions { gap: 6px; }

            .home-btn { padding: 8px; }

            .language-select {
                max-width: 100px;
                padding: 8px 5px;
            }

            .order-card { padding: 13px; }

            .order-top { gap: 8px; }

            .actions { flex-direction: column; }

            .btn { width: 100%; }

            .page-title { font-size: 21px; }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <h1 id="headerTitle">My Orders</h1>

        <div class="header-actions">
            <select
                id="languageSelect"
                class="language-select"
                aria-label="Select language"
            >
                <option value="en">English</option>
                <option value="sw">Kiswahili</option>
            </select>

            <button
                class="home-btn"
                type="button"
                onclick="window.location.href='index.html'"
                id="homeButton"
            >
                Home
            </button>
        </div>
    </div>
</header>

<main class="container">
    <div class="page-heading">
        <div>
            <h2 class="page-title" id="pageTitle">Order History</h2>
            <div class="order-count" id="orderCount"></div>
        </div>

        <button
            type="button"
            class="refresh-btn"
            id="refreshButton"
        >
            ↻ Refresh
        </button>
    </div>

    <div id="ordersContainer" aria-live="polite">
        <div class="loading" id="loadingMessage">
            Loading orders...
        </div>
    </div>
</main>

<nav class="bottom-nav">
    <a href="index.html" id="navHome">Home</a>
    <a href="cart.html" id="navCart">Cart</a>
    <a href="my-orders.html" class="active" id="navOrders">Orders</a>
    <a href="customer-account.html" id="navAccount">Account</a>
</nav>

<script>

/* ======================================

====================================== */

let currentUser = null;
let orders = [];
let orderChannel = null;
let isLoadingOrders = false;

const translations = {

        browse: "Browse Food",

        customer: "Customer",
        delivery: "Order type",
        location: "Location",
        total: "Total",
        track: "Track Order",
        again: "Order Again",
        checking: "Checking menu...",
        orderNotFound: "Order not found.",
        noRestaurant: "This order is not linked to a restaurant.",
        loadItemsError: "Could not load the items from this order.",
        noItems: "This order has no food items.",

        noMenuItems: "No valid menu items found in this order.",
        noAvailableItems: "None of the foods from this order are currently available.",
        unavailablePrefix: "Some items are unavailable and were skipped: ",
        orderAgainSuccess: "Available items added to your cart. Opening cart...",
        loadError: "Could not load orders. Please refresh and try again.",
        authError: "Please log in to view your orders.",

        pickupValue: "Pickup",
        pending: "Pending",

        ready: "Ready",

        loading: "Inapakia oda zako...",

        noOrdersText: "Oda zako zitaonekana hapa baada ya kuagiza chakula.",
        browse: "Angalia Vyakula",
        restaurant: "Mgahawa",
        customer: "Mteja",
        delivery: "Aina ya oda",
        location: "Mahali",

        track: "Fuatilia Oda",

        noAvailableItems: "Hakuna chakula cha oda hii kinachopatikana kwa sasa.",
        unavailablePrefix: "Baadhi ya vyakula havipatikani na vimeachwa: ",
        orderAgainSuccess: "Vyakula vinavyopatikana vimeongezwa kwenye kikapu. Kikapu kinafunguliwa...",
        loadError: "Imeshindikana kupakia oda. Onyesha upya na ujaribu tena.",
        authError: "Tafadhali ingia kwenye akaunti yako kuona oda zako.",
        deliveryValue: "Kuletewa",
        pickupValue: "Kujichukulia",
        pending: "Inasubiri",
        confirmed: "Imethibitishwa",
        preparing: "Inaandaliwa",
        ready: "Tayari",
        cancelled: "Imeghairiwa",
        orderCount: "oda",
        date: "Tarehe",
        notAvailable: "Haipatikani",
        status: "Hali",
        unexpectedError: "Hitilafu imetokea. Tafadhali jaribu tena.",
        emptyLocation: "Haijawekwa",
        refreshDone: "Oda zimeonyeshwa upya.",
        account: "Akaunti",

        orders: "Oda"

let language = localStorage.getItem("foodLanguage") || "en";

if (!translations[language]) {
    language = "en";
}

const t = key => translations[language][key] || key;

const container = document.getElementById("ordersContainer");

/* ======================================
   LANGUAGE
====================================== */

function applyLanguage() {
    document.documentElement.lang = language;
    document.getElementById("languageSelect").value = language;

    document.getElementById("headerTitle").textContent = t("header");
    document.getElementById("homeButton").textContent = t("home");
    document.getElementById("pageTitle").textContent = t("title");
    document.getElementById("refreshButton").textContent = t("refresh");

    document.getElementById("navHome").textContent = t("home");
    document.getElementById("navCart").textContent = t("cart");
    document.getElementById("navOrders").textContent = t("orders");
    document.getElementById("navAccount").textContent = t("account");

    renderOrders();
}

document.getElementById("languageSelect").addEventListener("change", event => {
    language = event.target.value === "sw" ? "sw" : "en";

    localStorage.setItem("foodLanguage", language);

    applyLanguage();
});

/* ======================================
   AUTHENTICATION
====================================== */

async function checkAuth() {
    if (typeof db === "undefined" || !db.auth) {
        container.innerHTML = `
            <div class="error-box">
                ${escapeHtml(t("loadError"))}
            </div>
        `;
        return false;
    }

    try {
        const { data, error } = await db.auth.getUser();

        if (error) {
            console.error("Authentication error:", error);
        }

        if (!data || !data.user) {
            window.location.href = "customer-login.html";
            return false;
        }

        currentUser = data.user;
        return true;

    } catch (error) {
        console.error("Authentication error:", error);

        container.innerHTML = `
            <div class="error-box">
                ${escapeHtml(t("authError"))}
                <br><br>
                <button class="btn btn-primary"
                    onclick="window.location.href='customer-login.html'">
                    ${escapeHtml(t("home"))}
                </button>
            </div>
        `;

        return false;
    }
}

/* ======================================
   LOAD ORDERS
====================================== */

async function loadOrders(showLoading = true) {
    if (!currentUser || isLoadingOrders) return;

    isLoadingOrders = true;

    if (showLoading) {
        container.innerHTML = `
            <div class="loading">${escapeHtml(t("loading"))}</div>
        `;
    }

    try {
        const { data, error } = await db
            .from("food_orders")
            .select("*")
            .eq("customer_id", currentUser.id)
            .order("created_at", { ascending: false });

        if (error) throw error;

        orders = data || [];
        renderOrders();

    } catch (error) {
        console.error("Load orders error:", error);

        container.innerHTML = `
            <div class="error-box">
                ${escapeHtml(t("loadError"))}
                <br><br>
                <button class="btn btn-primary" onclick="loadOrders(true)">
                    ${escapeHtml(t("refresh"))}
                </button>
            </div>
        `;

    } finally {
        isLoadingOrders = false;
    }
}

/* ======================================
   RENDER ORDER CARDS
====================================== */

function renderOrders() {
    if (!container) return;

    const countElement = document.getElementById("orderCount");

    if (countElement) {
        countElement.textContent =
            orders.length + " " + t("orderCount");
    }

    if (!orders.length) {
        container.innerHTML = `
            <div class="empty">
                <h3>${escapeHtml(t("noOrders"))}</h3>
                <p>${escapeHtml(t("noOrdersText"))}</p>
                <button
                    class="btn btn-primary"
                    style="max-width:220px"
                    onclick="window.location.href='index.html'">
                    ${escapeHtml(t("browse"))}
                </button>
            </div>
        `;
        return;
    }

    container.innerHTML = orders.map(order => {
        const status = normalizeStatus(order.status);
        const orderId = String(order.id || "");
        const orderNumber = String(order.order_number || "Order");
        const restaurantName = order.restaurant_name || "Food Platform";

        const deliveryType = formatDelivery(order.delivery_type);
        const location = order.delivery_location || t("emptyLocation");
        const customerName = order.customer_name || "-";
        const date = formatDate(order.created_at);

        return `
            <article class="order-card" id="order-${escapeHtml(orderId)}">
                <div class="order-top">
                    <div>
                        <div class="order-number">
                            #${escapeHtml(orderNumber)}
                        </div>

                        <div class="restaurant">
                            ${escapeHtml(t("restaurant"))}:
                            ${escapeHtml(restaurantName)}
                        </div>

                        <div class="order-date">
                            ${escapeHtml(t("date"))}: ${escapeHtml(date)}
                        </div>
                    </div>

                    <span class="status ${statusClass(status)}"
                        id="status-${escapeHtml(orderId)}">
                        ${escapeHtml(statusLabel(status))}
                    </span>
                </div>

                <div class="order-info">
                    <div class="info-row">
                        <span class="info-label">${escapeHtml(t("customer"))}</span>
                        <span class="info-value">${escapeHtml(customerName)}</span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">${escapeHtml(t("delivery"))}</span>
                        <span class="info-value">${escapeHtml(deliveryType)}</span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">${escapeHtml(t("location"))}</span>
                        <span class="info-value">${escapeHtml(location)}</span>
                    </div>

                    <div class="info-row">
                        <span class="info-label">${escapeHtml(t("total"))}</span>
                        <span class="info-value total">${money(order.total)}</span>
                    </div>
                </div>

                <div class="actions">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-action="track"
                        data-id="${escapeHtml(orderId)}">
                        ${escapeHtml(t("track"))}
                    </button>

                    <button
                        type="button"
                        class="btn btn-primary"
                        data-action="again"
                        data-id="${escapeHtml(orderId)}">
                        ${escapeHtml(t("again"))}
                    </button>
                </div>

                <div class="message" id="message-${escapeHtml(orderId)}"></div>
            </article>
        `;
    }).join("");
}

/* ======================================
   SAFE BUTTON HANDLING
====================================== */

container.addEventListener("click", event => {
    const button = event.target.closest("button[data-action]");
    if (!button) return;

    const orderId = button.dataset.id;
    if (!orderId) return;

    if (button.dataset.action === "track") {
        trackOrder(orderId);
    }

    if (button.dataset.action === "again") {
        orderAgain(orderId, button);
    }
});

/* ======================================
   TRACK ORDER
====================================== */

function trackOrder(orderId) {
    const order = orders.find(item => String(item.id) === String(orderId));

    if (!order) return;

    /*
      Keep these values for order-tracking.html and
      order-confirmation.html.
    */
    localStorage.setItem("lastOrderId", String(order.id));

    if (order.order_number) {
        localStorage.setItem("lastOrderNumber", String(order.order_number));
    }

    localStorage.setItem("lastOrder", JSON.stringify(order));

    const params = new URLSearchParams();
    params.set("id", String(order.id));

    if (order.order_number) {
        params.set("order", String(order.order_number));
    }

    window.location.href = "order-tracking.html?" + params.toString();
}

/* ======================================
   ORDER AGAIN
====================================== */

async function orderAgain(orderId, button) {
    const message = document.getElementById("message-" + orderId);

    if (!message || !currentUser) return;

    const originalText = button.textContent;

    button.disabled = true;
    message.className = "message info";
    message.textContent = t("checking");

    try {
        /* Load the selected order owned by this customer. */
        const { data: order, error: orderError } = await db
            .from("food_orders")
            .select("*")
            .eq("id", orderId)
            .eq("customer_id", currentUser.id)
            .maybeSingle();

        if (orderError) throw orderError;

        if (!order) {
            message.textContent = t("orderNotFound");
            return;
        }

        if (!order.restaurant_id) {
            message.textContent = t("noRestaurant");
            return;
        }

        /* Load the previous order items. */
        const { data: oldItems, error: itemError } = await db
            .from("food_order_items")
            .select("*")
            .eq("order_id", order.id);

        if (itemError) {
            console.error(itemError);
            message.textContent = t("loadItemsError");
            return;
        }

        if (!oldItems || !oldItems.length) {
            message.textContent = t("noItems");
            return;
        }

        /* Check that the restaurant still exists. */
        const { data: restaurant, error: restaurantError } = await db
            .from("food_restaurants")
            .select("*")
            .eq("id", order.restaurant_id)
            .maybeSingle();

        if (restaurantError) throw restaurantError;

        if (!restaurant) {
            message.textContent = t("restaurantUnavailable");
            return;
        }

        const menuIds = [
            ...new Set(
                oldItems
                    .map(item => item.menu_id)
                    .filter(Boolean)
            )
        ];

        if (!menuIds.length) {
            message.textContent = t("noMenuItems");
            return;
        }

        /* Read current menu prices and availability. */
        const { data: currentMenu, error: menuError } = await db
            .from("food_menu")
            .select("id, restaurant_id, name, price, image_url, is_available")
            .eq("restaurant_id", order.restaurant_id)
            .in("id", menuIds);

        if (menuError) throw menuError;

        const menuMap = new Map(
            (currentMenu || []).map(item => [String(item.id), item])
        );

        const cart = [];
        const unavailableItems = [];

        oldItems.forEach(oldItem => {
            const currentItem = menuMap.get(String(oldItem.menu_id));

            if (!currentItem) {
                unavailableItems.push(oldItem.food_name || "Food item");
                return;
            }

            if (currentItem.is_available === false) {
                unavailableItems.push(currentItem.name || oldItem.food_name || "Food item");
                return;
            }

            const price = Number(currentItem.price);

            if (!Number.isFinite(price) || price < 0) {
                unavailableItems.push(currentItem.name || oldItem.food_name || "Food item");
                return;
            }

            cart.push({
                menu_id: currentItem.id,
                restaurant_id: currentItem.restaurant_id,
                food_name: currentItem.name,
                price: price,
                quantity: Math.max(1, Number(oldItem.quantity) || 1),
                image_url: currentItem.image_url || ""
            });
        });

        if (!cart.length) {
            message.textContent = t("noAvailableItems");
            return;
        }

        /* Save the rebuilt cart using the existing cart format. */
        localStorage.setItem("foodCart", JSON.stringify(cart));
        localStorage.setItem("cartRestaurantId", String(restaurant.id));

        localStorage.setItem(
            "orderAgainRestaurant",
            JSON.stringify({
                id: restaurant.id,
                name: restaurant.name
            })
        );

        if (unavailableItems.length) {
            localStorage.setItem(
                "orderAgainMessage",
                unavailableItems.join(", ")
            );
        } else {
            localStorage.removeItem("orderAgainMessage");
        }

        message.className = "message success";
        message.textContent = unavailableItems.length
            ? t("unavailablePrefix") + unavailableItems.join(", ")
            : t("orderAgainSuccess");

        /* Continue to the existing cart and checkout flow. */
        window.location.href = "cart.html";

    } catch (error) {
        console.error("Order again error:", error);

        message.className = "message error";
        message.textContent =
            error && error.message
                ? error.message
                : t("unexpectedError");

    } finally {
        button.disabled = false;
        button.textContent = originalText;
    }
}

/* ======================================
   REALTIME ORDER STATUS
====================================== */

function subscribeToOrders() {
    if (!currentUser || typeof db.channel !== "function") return;

    try {
        if (orderChannel) {
            db.removeChannel(orderChannel);
        }

        orderChannel = db
            .channel("customer-orders-" + currentUser.id)
            .on(
                "postgres_changes",
                {
                    event: "*",
                    schema: "public",
                    table: "food_orders",
                    filter: "customer_id=eq." + currentUser.id
                },
                payload => {
                    const updatedOrder = payload.new;

                    if (!updatedOrder || !updatedOrder.id) {
                        loadOrders(false);
                        return;
                    }

                    const index = orders.findIndex(
                        order => String(order.id) === String(updatedOrder.id)
                    );

                    if (payload.eventType === "DELETE") {
                        orders = orders.filter(
                            order => String(order.id) !== String(payload.old.id)
                        );
                        renderOrders();
                        return;
                    }

                    if (index === -1) {
                        loadOrders(false);
                        return;
                    }

                    orders[index] = {
                        ...orders[index],
                        ...updatedOrder
                    };

                    const statusElement = document.getElementById(
                        "status-" + updatedOrder.id
                    );

                    if (statusElement) {
                        const status = normalizeStatus(updatedOrder.status);
                        statusElement.className =
                            "status " + statusClass(status);
                        statusElement.textContent = statusLabel(status);
                    }
                }
            )
            .subscribe();

    } catch (error) {
        console.error("Realtime subscription error:", error);
    }
}

/* ======================================
   HELPERS
====================================== */

function normalizeStatus(status) {
    const value = String(status || "Pending").trim().toLowerCase();

    const knownStatuses = {
        pending: "Pending",
        confirmed: "Confirmed",
        preparing: "Preparing",
        ready: "Ready",
        cancelled: "Cancelled"
    };

    return knownStatuses[value] || String(status || "Pending");
}

function statusClass(status) {
    return String(status || "Pending")
        .toLowerCase()
        .replace(/[^a-z]/g, "");
}

function statusLabel(status) {
    const normalized = normalizeStatus(status);

    const keys = {
        Pending: "pending",
        Confirmed: "confirmed",
        Preparing: "preparing",
        Ready: "ready",
        Cancelled: "cancelled"
    };

    return t(keys[normalized] || normalized);
}

function formatDelivery(value) {
    const normalized = String(value || "").trim().toLowerCase();

    if (normalized === "delivery") return t("deliveryValue");
    if (normalized === "pickup" || normalized === "pick-up") {
        return t("pickupValue");
    }

    return value || "-";
}

function money(value) {
    const amount = Number(value || 0);

    return "TSh " + (Number.isFinite(amount) ? amount : 0)
        .toLocaleString("en-TZ", {
            minimumFractionDigits: 0,
            maximumFractionDigits: 2
        });
}

function formatDate(value) {
    if (!value) return "-";

    const date = new Date(value);

    if (Number.isNaN(date.getTime())) return "-";

    return date.toLocaleString(
        language === "sw" ? "sw-TZ" : "en-TZ",
        {
            year: "numeric",
            month: "short",
            day: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );
}

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* ======================================
   PAGE INITIALIZATION
====================================== */

document.getElementById("refreshButton").addEventListener("click", async () => {
    await loadOrders(true);
});

async function init() {
    applyLanguage();

    const authenticated = await checkAuth();

    if (!authenticated) return;

    await loadOrders(true);
    subscribeToOrders();
}

init();
</script>
